utton><button data-action="service-setting">Pi settings</button></div>`}

case'legacy':modal('Unassigned owner session','<p>Preserve its native history and working directory. Explicit project association changes its label and navigation only, never its permissions or task lease.</p>');break;
case'extension-yes':state.extension=true;render();toast('Mock extension answer recorded once. No Pi extension was contacted.');break;
case'extension-no':state.extension=false;toast('Mock extension scope retained.');break;
case'send':send();break;
case'stop':state.running[key()]=false;render();toast('Mock run stopped. No process was contacted.');break;
case'steer':toast('Mock steering action. No running process was interrupted.');break;
case'followup':toast('Mock follow-up queued. No running process was changed.');break;
case'attach':toast('Attachment interaction placeholder. No local file is read or uploaded.');break;
case'source-down':state.sourceDown=!state.sourceDown;render();break;
case'compare':modal('Compare retained evidence','<h3>Choose compatible benchmark runs</h3><p>Model revision, hardware, context, concurrency, output constraints, cache state and correctness must be known and compatible.</p><div class="notice">These fixtures have different suites. Comparison is unavailable; unknown dimensions are never treated as matches.</div>');break;
case'experiment':modal('New experiment','<h3>Continue the existing experiment journey</h3><p>Select a declared experiment, review its owner, exact impact and restoration steps, then confirm through the existing managed flow.</p><div class="notice">This mockup does not dispatch experiments or change serving state.</div>');break;
case'artifact':modal('Retained evidence','<p>Illustrative artifact reference only. The product resolves it through the authenticated owner; browser input never selects an arbitrary file.</p>');break;
case'run-preview':startPreview();break;
case'start-demo':state.newChat=false;state.taskLaunched=true;state.view='pi';state.mode='task';state.running[key()]=true;state.run='task-15';closeDialogs();render();toast('Simulated task opened in Pi. Its linked run is now visible in Workbench.');break;
case'task-detail':if(innerWidth<=1100)modal('Selected task',taskDetail());else toast('T015 selected. Review the task panel on the right.');break;
case'plan-error':state.planError=!state.planError;render();break;
case'read-plan':state.planError=false;render();break;
case'other-plan':modal('Draft plan','<p>This plan is not approved for execution. The Run with Pi action remains unavailable until canonical readiness passes.</p>');break;
case'done-task':toast('Verified fixture. Completion comes from canonical State evidence, not this mockup.');break;
case'skills':case'service-setting':settings('service');break;
case'context':contextPicker();break;
case'worktree':modal('Execution workspace','<h3>pi/run-history</h3><p>This conversation stays bound to its current workspace. Choosing another branch starts or opens a different conversation; it does not retarget a running writer.</p><div class="notice">Worktree creation uses the existing owner flow. No branch or checkout is changed here.</div>');break;
}});
$('#menu').addEventListener('close',()=>$('#menu-trigger').setAttribute('aria-expanded','false'));
render();
</script>
</body>
</html>
