  [recipe.hardware]
  gpu = "NVIDIA GeForce RTX 5090"
  arch = "sm_120"
  vram_total_gb = 32
  vram_note = "128K BF16 no-MTP memory calibration. Prior no-spec target+vision weights21.34GiB;128K target KV alone8GiB. Context-dependent hybrid overhead must be measured. Fraction0.95 failed CUDA startup reserve beforeweights. Fraction0.93 with1GiB CPUweightoffload preserves BF16KV/defaultFP32SSM; require1024MiBfree after representativeworkload."

  [recipe.serve]
  engine = "vllm"
  image = "vllm/vllm-openai:v0.29.0@sha256:082ca6f035279109041ffd3fe0695cb568b29bc580b35c4f297a66a08b216c1b"
  entrypoint = [
    "python3",
    "-m",
    "vllm.entrypoints.openai.api_server",
  ]
  model_flag = "--model"
  model_path = "/root/.cache/huggingface/hub/models--bottlecapai--ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ/snapshots/f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"
  quantization = "NVFP4 W4A4 AWQ mixed FP8/BF16; BF16 vision; full checkpoint retained; MTP disabled for cache capacity; target TRITON_ATTN and BF16 KV"
  context_tokens = 131072
  port = 39283
  health = "/health"
  startup_timeout_seconds = 2400
  served_model_name = "thinkingcap-awq-5090"
  ipc = "host"
  shm_size = "8gb"
  named_volumes = ["thinkingcap-vllm029-5090:/root/.cache/vllm"]
  env = [
    "CUDA_DEVICE_ORDER=PCI_BUS_ID",
    "PYTHONHASHSEED=0",
    "MAX_JOBS=2",
    "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  ]
  flags = [
    "--served-model-name thinkingcap-awq-5090",
    "--tensor-parallel-size 1",
    "--max-model-len 131072",
    "--max-num-seqs 1",
    "--max-num-batched-tokens 1024",
    "--gpu-memory-utilization 0.93",
    "--kv-cache-dtype bfloat16",
    "--cpu-offload-gb 1",
    "--offload-backend uva",
    "--attention-backend TRITON_ATTN",
    "--no-enable-prefix-caching",
    "--reasoning-parser qwen3",
    "--enable-auto-tool-choice",
    "--tool-call-parser qwen3_xml",
    "--limit-mm-per-prompt '{\"image\":2,\"video\":0}'",
    "--mm-processor-kwargs '{\"size\":{\"longest_edge\":1048576,\"shortest_edge\":65536}}'",
    "--generation-config vllm",
    "--host 0.0.0.0",
    "--port 39283",
  ]
  note = "128K C1 target-only, explicit TRITON_ATTN, bfloat16 KV, full vision. MTP weights remain in complete local snapshot but are not loaded for speculation. 1GiB CPUweightoffload calibration, not qualification until exact128K cache capacity, long-input/vision/quality and measuredspeed gates pass."

  [recipe.fit]
  suited = [
    "memory-calibration",
    "qualification-candidate",
  ]
  not_suited = [
    "automatic-promotion",
    "unqualified-long-context",
    "video",
  ]
  rationale = "User requires at least128K. Disable MTP to recover weight and draft-cache memory; use fraction0.93 with1GiB supportedUVA CPUweightoffload and1024MiB measured-free minimum. Measure the offload cost instead of assuming GPU-only speed. Preserve BF16 cache and full vision."

