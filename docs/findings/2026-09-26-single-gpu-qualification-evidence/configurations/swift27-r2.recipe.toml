context_tokens = 327680
port = 39142
health = "/health"
startup_timeout_seconds = 2400
served_model_name = "swift15-27b-nvfp4-327k-r2"
ipc = "host"
shm_size = "4gb"
memory_limit_mib = 53248
memory_swap_limit_mib = 53249
host_memory_reserve_mib = 12288
named_volumes = ["single-gpu-swift27-vllm-0271:${ENGINE_CACHE}"]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
  "MAX_JOBS=2",
]
flags = [
  "--dtype bfloat16",
  "--mamba-ssm-cache-dtype float32",
  "--hf-overrides '{\"text_config\":{\"rope_parameters\":{\"mrope_interleaved\":true,\"mrope_section\":[11,11,10],\"partial_rotary_factor\":0.25,\"rope_theta\":10000000,\"rope_type\":\"yarn\",\"factor\":2.0,\"original_max_position_embeddings\":262144}}}'",
  "--limit-mm-per-prompt '{\"image\":8,\"video\":0}'",
  "--max-num-batched-tokens 8192",
  "--served-model-name swift15-27b-nvfp4-327k-r2",
  "--tensor-parallel-size 1",
  "--max-model-len 327680",
  "--max-num-seqs 4",
  "--gpu-memory-utilization 0.90",
  "--kv-cache-dtype auto",
  "--no-enable-prefix-caching",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--generation-config vllm",
  "--host 0.0.0.0",
  "--port 39142",
]
note = "Reuses pinned vLLM0.27.1 SM120 recipe lineage. Full multimodal model, native thinking, explicit YaRN2 to327680, C4 scheduling not four full contexts. Exact Swift export generation and cache resolution require startup and behavioral proof."

