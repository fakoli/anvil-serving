    "https://github.com/brandonmmusic-max/glm-5.3-flash-exl3-4bpw/blob/3e7073f52e7a9073100724f38019e2edb9f87702/runtime/serve-glm53-sm120-tp2.sh",
    "https://github.com/brandonmmusic-max/glm-5.3-flash-exl3-4bpw/commit/bd5321c1cfd4b8d352ef380e3158c64886039d03",
  ]
  local = [
    "/srv/example/models/glm53-flash-exl3-4bpw-a5fee92/MANIFEST.json",
    "/srv/example/models/glm53-flash-exl3-4bpw-a5fee92/config.json",
    "/srv/example/models/glm53-flash-exl3-4bpw-a5fee92/exl3-mcg-storage-abi.json",
