flags = ["--model /root/.cache/huggingface/hub/models--local-inference-lab--Qwen3.8-Flash-Next-NVFP4/snapshots/7c4f1bc1a2d6847e0cbc01ac6b823f00251de8dd", "--limit-mm-per-prompt '{\"image\":8,\"video\":0}'", "--override-generation-config '{\"max_new_tokens\":65536,\"temperature\":1.0,\"top_p\":0.95}'"]
