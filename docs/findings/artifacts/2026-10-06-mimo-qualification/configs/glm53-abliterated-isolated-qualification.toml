# Isolated qualification: no router_tier or profile is declared.
# Managed mode drains the existing r11 tier and restores it on leave/failure.
[[gpu_roles]]
id = "compute-a"
vram_mib = 97887
reserve_mib = 0

[[gpu_roles]]
id = "compute-b"
vram_mib = 97887
reserve_mib = 0

[[serve]]
name = "tp2-glm53-abliterated-v84-dcp1-c4-r1"
container = "glm53-abliterated-v84-dcp1-c4-r1"
runtime = "docker"
port = 39133
model = "glm53-abliterated-exl3-v84-fp8-tp2-dcp1-c4-327k-r1"
engine = "vllm"
gpu_roles = ["compute-a", "compute-b"]
vram_mib = 97887
residency = "on-demand"
operating_mode = "dual-gpu-exclusive"
tensor_parallel_size = 2
health = "/v1/models"
groups = ["glm53-abliterated-isolated-c4"]
up = "/srv/anvil-serving/.venv/bin/python -m anvil_serving.cli models recipes load lovesenko/GLM-5.3-Flash-tr3-4bpw-Abliterated --registry {dir}/serve-recipes.glm53-abliterated-20261006.toml --container glm53-abliterated-v84-dcp1-c4-r1 --gpu-device GPU-COMPUTE-A,GPU-COMPUTE-B --transport local --confirm"
