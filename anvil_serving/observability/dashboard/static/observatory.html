<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Anvil Workbench</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./observatory.css" />
    <link rel="stylesheet" href="./workbench.css" />
    <script type="module" src="./observatory.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" class="app-shell">
      <aside
        id="navigation"
        class="sidebar"
        aria-label="Application navigation"
      >
        <a class="brand" href="#/workbench" aria-label="Anvil Workbench">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
            <path
              d="M3 8h30l-8 9H14l-5-4H3zm12 12h10l3 8H11z"
              fill="currentColor"
            />
          </svg>
          <span>ANVIL<span class="brand-sub">WORKBENCH</span></span>
        </a>
        <div class="workspace-label">
          <span class="workspace-icon" aria-hidden="true">L</span
          ><span>Local research<small>Operator workspace</small></span>
        </div>
        <p class="nav-label">WORKSPACE</p>
        <nav id="primary-navigation" aria-label="Main"></nav>
        <div class="sidebar-foot">
          <span class="eyebrow">SERVING · STATE · RESEARCH</span>
          <p id="principal-label">Your private workspace</p>
          <span id="build-label" class="meta"></span>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button
            id="menu-toggle"
            class="icon-button"
            aria-label="Open navigation"
            aria-controls="navigation"
            aria-expanded="false"
          >
            ☰
          </button>
          <div id="breadcrumb" class="breadcrumb">Workbench</div>
          <div class="topbar-end">
            <span id="fixture-label" class="badge warning" hidden
              >Isolated fixture</span
            ><span id="access-mode" class="badge">Signed out</span
            ><button id="account-button" class="quiet-button">Sign in</button>
          </div>
        </header>
        <section
          id="system-hud"
          class="system-hud"
          aria-label="System status and compute selection"
          hidden
        ></section>
        <div id="scope-bar" class="scope-bar" hidden></div>
        <main id="main" tabindex="-1">
          <p class="loading" role="status">Connecting to Workbench…</p>
        </main>
        <footer class="workspace-foot">
          <span>Serving · Telemetry · Anvil State</span
          ><span id="connection-status" role="status">Connecting</span>
        </footer>
      </div>
    </div>
    <div
      id="announcer"
      class="sr-only"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <dialog id="operation-dialog" aria-labelledby="dialog-title"></dialog>
    <noscript
      >This application requires JavaScript. The independently authorized legacy
      dashboard remains available at its configured address.</noscript
    >
  </body>
</html>
