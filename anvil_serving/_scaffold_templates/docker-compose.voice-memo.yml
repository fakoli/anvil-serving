# Voice memo capture as a Docker-MANAGED CONTAINER (ADR-0048). Runs the
# package CLI verb `anvil-serving voice memo run` from the repository
# Dockerfile's `voice-memo` target (the shared runtime plus ffmpeg). Managed via
# `anvil-serving serves up voice-memo --manifest serves.voice.toml`; do not
# docker-run by hand.
#
# Host networking is deliberate: the service refuses a non-loopback bind, the
# gateway listens on host loopback, and `tailscale serve` proxies the tailnet
# edge to the same 127.0.0.1 listener. Nothing else publishes this port.
#
# Build: docker build --target voice-memo -t anvil-serving-voice-memo:3.1.0 .
# VOICE_MEMO_IMAGE is a per-invocation candidate override.
name: anvil-voice-memo

services:
  voice-memo:
    image: ${VOICE_MEMO_IMAGE:-anvil-serving-voice-memo:3.1.0}
    container_name: anvil-voice-memo
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/anvil/voice.toml"]
    environment:
      # Resolved by env-var NAME from [voice.memo]; values come from the
      # operator's protected environment file, never from this file.
      ANVIL_VOICE_MEMO_ROUTER_KEY: ${ANVIL_VOICE_MEMO_ROUTER_KEY:?set ANVIL_VOICE_MEMO_ROUTER_KEY}
      ANVIL_VOICE_MEMO_LOGINS: ${ANVIL_VOICE_MEMO_LOGINS:?set ANVIL_VOICE_MEMO_LOGINS}
    volumes:
      - "${VOICE_CONFIG_DIR:-./voice}:/etc/anvil:ro"
      # Memo audio and transcripts: user content, evaluation-excluded.
      - "${VOICE_MEMO_DATA:-./voice-memos}:/var/lib/anvil-voice-memo"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8790/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
