# Canonical topology-owned Anvil Voice configuration.
#
# This file is intentionally co-located with serves.voice.toml.  The default
# profile owns STT/TTS and the optional Realtime proxy through the normal
# anvil-serving lifecycle; Mini remains model-free in the reference topology.

[voice]
name = "anvil-voice-dark"
realtime_host = "127.0.0.1"
realtime_port = 8765

[voice.llm]
base_url = "http://127.0.0.1:8000/v1"
model = "llm.voice"
stream = true
api_key_env = "ANVIL_ROUTER_TOKEN"
system_prompt = "You are Anvil Voice. Keep spoken answers concise, direct, and useful."
temperature = 0.2
max_tokens = 256

[voice.stt]
base_url = "http://127.0.0.1:30010/v1"
model = "tdt-0.6b-v3"
stream = false
response_format = "json"
timeout = 120.0
lifecycle = "managed"
serve_name = "stt"
manifest_path = "serves.voice.toml"
ready_url = "http://127.0.0.1:30010/health"

[voice.tts]
base_url = "http://127.0.0.1:30011/v1"
model = "kokoro"
timeout = 120.0
lifecycle = "managed"
serve_name = "tts"
manifest_path = "serves.voice.toml"
ready_url = "http://127.0.0.1:30011/health"
response_format = "pcm"
source_sample_rate = 24000
target_sample_rate = 16000

[voice.proxy]
lifecycle = "managed"
serve_name = "realtime-proxy"
manifest_path = "serves.voice.toml"
listen_host = "127.0.0.1"
listen_port = 8765
ready_url = "http://127.0.0.1:8765/healthz"
stt_url = "http://stt:8080/v1"
tts_url = "http://tts:8880/v1"
router_url = "http://100.64.0.10:8000/v1"

# Voice memo capture (ADR-0048): `anvil-serving voice memo run`, normally the
# `voice-memo` serve in serves.voice.toml. It transcribes through the gateway's
# /v1/audio/transcriptions with a device key bound to one audio route:
#   anvil-serving router keys create --name voice-memo --model <stt route id> \
#     --model llm.voice --model llm.primary --path /v1/audio/transcriptions \
#     --path /v1/chat/completions --rpm 120 --out <protected file>
# Both env values are secrets/identities supplied at runtime, never written here.
[voice.memo]
router_url = "http://127.0.0.1:8000"
router_key_env = "ANVIL_VOICE_MEMO_ROUTER_KEY"
allowed_logins_env = "ANVIL_VOICE_MEMO_LOGINS"
data_dir = "/var/lib/anvil-voice-memo"
listen_host = "127.0.0.1"
listen_port = 8790

# Rewrite targets: the allowlisted gateway chat aliases a stored memo can be
# rewritten on (POST /v1/memos/{id}/process). GET /v1/memos/targets lists ids,
# labels and the default, never the alias. The key also needs
# `--path /v1/chat/completions` and a `--model` grant for every alias below.
# Profiles (saved prompts) are built in, plus custom ones kept in data_dir.
[voice.memo.targets.voice]
label = "Voice LLM"
detail = "Small, fast instruct model"
model = "llm.voice"
default = true

[voice.memo.targets.primary]
label = "Primary"
detail = "Largest local model"
model = "llm.primary"

# A named profile makes the reference choice explicit without changing the
# already-consistent default tables above.
[voice.profiles.dark-audio]
