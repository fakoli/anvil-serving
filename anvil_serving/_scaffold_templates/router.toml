# anvil-serving direct capability-gateway configuration.
#
# The model aliases in [router.model_routes] are the complete chat vocabulary.
# Unknown aliases return 404; they are never classified or rerouted.  `auth_env`
# names an environment variable, never a literal secret.
claude_logs = "~/.claude/projects"
hf_extra_roots = []
model_dirs = []
gpu_index = 0
served_model_name = "local-specialist"

[router]
relay_timeout = 20
availability_probe_interval = 5
availability_probe_timeout = 1

[[router.tiers]]
id = "primary-local"
base_url = "http://127.0.0.1:30002/v1"
model = "laguna-s-2.1-nvfp4"
dialect = "openai"
context_limit = 262144
privacy = "local"
tool_support = true
auth_env = "ANVIL_PRIMARY_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "omni-local"
base_url = "http://127.0.0.1:30003/v1"
model = "nemotron3-omni-30b-a3b-nvfp4"
dialect = "openai"
context_limit = 65536
privacy = "local"
tool_support = true
auth_env = "ANVIL_OMNI_LOCAL_KEY"
health_path = "/health"

# Caller model alias -> exactly one local chat tier.
[router.model_routes]
llm.primary = "primary-local"
llm.voice = "omni-local"
vision.ocr = "omni-local"
vision.general = "omni-local"

# Deterministic purpose-model routes. They have their own endpoints:
# POST /v1/embeddings and POST /v1/rerank.
[[router.purpose_models]]
id = "embeddings-local"
kind = "embedding"
model = "qwen3-embedding-0.6b"
base_url = "http://127.0.0.1:30005/v1"

[[router.purpose_models]]
id = "reranker-local"
kind = "rerank"
model = "qwen3-reranker-0.6b"
base_url = "http://127.0.0.1:30006/v1"

[[router.audio_routes]]
id = "local-stt"
purpose = "stt"
model = "tdt-0.6b-v3"
base_url = "http://127.0.0.1:30010/v1"
default = true

[[router.audio_routes]]
id = "local-tts"
purpose = "tts"
model = "kokoro"
base_url = "http://127.0.0.1:30011/v1"
source_sample_rate = 24000
default = true
