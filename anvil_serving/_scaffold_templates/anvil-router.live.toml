# Fakoli Dark reference topology. This is a configuration example, not live
# qualification evidence. Use preflight and benchmark artifacts before exposure.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
relay_timeout = 60
availability_probe_interval = 5
availability_probe_timeout = 1

# RTX PRO 6000: the sole primary LLM capability.
[[router.tiers]]
id = "primary-local"
base_url = "http://host.docker.internal:30002/v1"
model = "agents-a1-fp8-mm-262k"
dialect = "openai"
context_limit = 262144
privacy = "local"
tool_support = true
auth_env = "ANVIL_PRIMARY_LOCAL_KEY"
engine = "vllm"
quantization = "fp8"
max_concurrency = 1
health_path = "/health"
model_identity = true
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[router.tiers.params.capacity]
gpu_role = "primary"
gpu_name = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
gpu_memory_total_mib = 97887
model_memory_gib = 35.31
kv_cache_capacity_tokens = 5277426
scheduler_max_num_seqs = 1
image_limit = 4
video_limit = 1

[router.tiers.params.capabilities]
modalities = ["text", "image", "video"]
thinking = { supported = true, default = "disabled", caller_override = false }
images_per_request = 4
video_per_request = 1

[router.tiers.params.fingerprint]
model_revision = "4d7d59380f327b76e73bc71f40e0c589ad0ca1d5"
engine_version = "vllm-0.23.1rc1.dev1327-gf25953cc5"

# Compute B: one Omni tier for voice text, general vision, and OCR.
[[router.tiers]]
id = "omni-local"
base_url = "http://host.docker.internal:30003/v1"
model = "nemotron3-omni-30b-a3b-nvfp4"
dialect = "openai"
context_limit = 65536
privacy = "local"
tool_support = true
auth_env = "ANVIL_OMNI_LOCAL_KEY"
health_path = "/health"
model_identity = true

[router.model_routes]
llm.primary = "primary-local"
llm.voice = "omni-local"
vision.ocr = "omni-local"
vision.general = "omni-local"

[[router.purpose_models]]
id = "embeddings-local"
kind = "embedding"
model = "qwen3-embedding-0.6b"
base_url = "http://host.docker.internal:30005/v1"

[[router.purpose_models]]
id = "reranker-local"
kind = "rerank"
model = "qwen3-reranker-0.6b"
base_url = "http://host.docker.internal:30006/v1"

[[router.audio_routes]]
id = "dark-stt"
purpose = "stt"
model = "tdt-0.6b-v3"
base_url = "http://host.docker.internal:30010/v1"
default = true

[[router.audio_routes]]
id = "dark-tts"
purpose = "tts"
model = "kokoro"
base_url = "http://host.docker.internal:30011/v1"
source_sample_rate = 24000
default = true
