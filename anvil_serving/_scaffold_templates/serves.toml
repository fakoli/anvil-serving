# Declarative serves manifest for the fakoli-dark (flexibility-mode) topology.
#
# `anvil-serving serves {status|up|down}` reads this — the single source of truth for
# "which model containers exist, on which ports". Manage the serves ONLY through
# `anvil-serving serves` (which delegates to docker-compose.yml), never raw `docker`.
#
# 2026-07-29 reconcile: Primary = Agents-A1 official FP8 at 262,144 tokens
# with four-image/one-video input and thinking hard-disabled by the router
# (:30002, PRO 6000). Qwen3.5 122B is the immediate rollback; Laguna S 2.1 and
# GPT-OSS Puzzle remain additional recovery options.
# 2026-08-01 symmetric topology: Nemotron 3 Nano Omni occupies Compute B
# and backs voice text, general vision, and OCR through one
# router tier on :30003. Embeddings and reranking remain a separate,
# mutually-exclusive auxiliary stack. `{dir}` resolves to this file's dir.
#
# Both capability serves are Docker-Compose-defined — see
# docs/adr/0002-serves-are-compose-defined.md. Each `up` targets its own compose service by
# name, so `serves up primary` and `serves up omni` stay independent. `docker compose up -d` is
# drift-safe (natively recreates a service whose config changed). Use `serves up --recreate
# <name>` to force a fresh container.

# ADR-0017 GPU reservations for two equivalent RTX PRO 6000 Max-Q cards.
# `serves up` admits before running a container command and `serves status`
# reports the derived ledger. Each card exposes 97887 MiB; 3072 MiB remains
# reserved for Windows/driver overhead. STT/TTS declare their own reservations
# in serves.voice.toml, so admission can distinguish the exclusive 30B Omni from
# the smaller Omni + voice stack instead of hiding voice inside this reserve.
[[gpu_roles]]
id = "dark-compute-a"
vram_mib = 97887
reserve_mib = 3072

[[gpu_roles]]
id = "dark-compute-b"
vram_mib = 97887
reserve_mib = 3072

# Human-approved 2026-08-02 fallback for the dedicated single-user Pi route
# after the 1M profile exposed a B12X locked-workspace failure on a normal Pi
# prompt. This exclusive owner is the only GPU inference workload admitted
# while active.
[[serve]]
name = "tp2-deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-650k"
stack = "serving"
container = "vllm-tp2-deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-650k"
port = 39062
model = "deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-tp2-650k"
engine = "vllm"
health = "/health"
gpu_roles = ["dark-compute-a", "dark-compute-b"]
vram_mib = 94721
residency = "on-demand"
operating_mode = "dual-gpu-exclusive"
tensor_parallel_size = 2
router_tier = "primary-local"
groups = ["tp2-pi"]
up = "python -m anvil_serving.cli models recipes load deepseek-ai/DeepSeek-V4-Flash-0731 --registry {dir}/../../configs/deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-650k-recipe.toml --container vllm-tp2-deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-650k --gpu-device GPU-d0f446cf-1771-414c-e116-a39138798a8c,GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490 --confirm"

