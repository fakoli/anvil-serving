# Direct capability gateway for a router container on the same Compose network.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
availability_probe_interval = 5
availability_probe_timeout = 1

[[router.tiers]]
id = "primary-local"
base_url = "http://primary:30000/v1"
model = "qwen35-awq-local"
dialect = "openai"
context_limit = 131072
privacy = "local"
tool_support = true
auth_env = "ANVIL_PRIMARY_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "omni-local"
base_url = "http://omni:30003/v1"
model = "nemotron3-omni-30b-a3b-nvfp4"
dialect = "openai"
context_limit = 65536
privacy = "local"
tool_support = true
auth_env = "ANVIL_OMNI_LOCAL_KEY"
health_path = "/health"
model_identity = true

[router.model_routes]
llm.primary = "primary-local"
llm.voice = "omni-local"
vision.ocr = "omni-local"
vision.general = "omni-local"
