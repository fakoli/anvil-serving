# Direct capability gateway for a router container on the same Compose network.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
availability_probe_interval = 5
availability_probe_timeout = 1

[[router.tiers]]
id = "primary-local"
base_url = "http://primary:30000/v1"
model = "qwen35-awq-local"
dialect = "openai"
context_limit = 131072
privacy = "local"
tool_support = true
auth_env = "ANVIL_PRIMARY_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "auxiliary-local"
base_url = "http://auxiliary:30001/v1"
model = "gpt-oss-20b"
dialect = "openai"
context_limit = 32768
privacy = "local"
tool_support = true
auth_env = "ANVIL_AUXILIARY_LOCAL_KEY"
health_path = "/health"

[router.model_routes]
llm.primary = "primary-local"
llm.voice = "auxiliary-local"
