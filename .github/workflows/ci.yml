name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"
  ANVIL_SERVING_NO_HOME_ENV: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-audit:
    name: docs audit (CLI references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Verify active CLI references (all scopes)
        # Run the repo-level audit once, outside the Python version matrix.
        run: |
          python scripts/audit_cli_references.py --check --scope docs
          python scripts/audit_cli_references.py --check --scope skills
          python scripts/audit_cli_references.py --check --scope full
          python scripts/audit_cli_references.py --check --scope fixtures

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Every supported minor version runs the full suite on Ubuntu; macOS
        # runs one version (3.12) for platform coverage.
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Use a short TMPDIR (macOS)
        # The default macOS TMPDIR is long enough to break AF_UNIX socket paths.
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$(mktemp -d /tmp/t.XXXX)/" >> "$GITHUB_ENV"

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Check Node.js
        run: node --version

      - name: Run tests
        # Four duration-balanced pytest shards, one per runner vCPU. The 3.13 leg adds
        # coverage and runs everything; the others skip tests marked slow.
        if: runner.os == 'Linux'
        run: python scripts/run_tests.py --shards 4 ${{ matrix.python-version == '3.13' && '--coverage' || '-m "not slow"' }} -x -q --durations=40 --junitxml=test-results.xml -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

      - name: Run tests (macOS)
        # One balanced shard per runner vCPU; the whole suite, slow tests included.
        if: runner.os == 'macOS'
        run: python scripts/run_tests.py --shards auto -q --durations=40 --junitxml=test-results.xml -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

      - name: Retain test timings and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ github.sha }}-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results*.xml
          if-no-files-found: warn

      - name: Enforce 70% coverage
        if: matrix.python-version == '3.13'
        run: python -m coverage report

  windows-cli:
    name: Windows CLI smoke (py3.13)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install CLI and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed version
        run: anvil-serving --version
      - name: Verify installed help
        run: anvil-serving --help > $null
      - name: Verify installed command manifest
        run: |
          anvil-serving --command-manifest > "$env:RUNNER_TEMP/command-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m json.tool "$env:RUNNER_TEMP/command-manifest.json" > $null
          exit $LASTEXITCODE
      - name: Verify desktop modes and job-owned worker release
        run: python -m pytest -q tests/test_desktop.py tests/test_desktop_modes.py tests/media/test_idle_teardown.py
      - name: Verify synthetic topology and typed remote dispatch
        run: >-
          python -m pytest -q
          tests/test_cli.py::test_topology_resolve_json_is_structured_and_contextual
          tests/test_cli.py::test_cli_remote_config_export_maps_path_and_allows_bounded_large_response
          tests/test_cli.py::test_cli_remote_router_restart_dispatches_typed_operation
          tests/test_cli.py::test_cli_remote_router_dry_run_never_generates_mutation_idempotency
      - name: Verify cache cleanup refuses unsupported mutation
        run: >-
          python -m pytest -q
          tests/test_models.py::test_legacy_docker_revision_apply_never_dispatches_even_with_confirmation
          tests/test_models.py::test_volume_report_timeout_is_bounded_and_not_retried
          tests/test_models.py::test_whole_cache_discard_requires_posix_before_audit
          tests/test_model_cache_discard.py
      - name: Verify native Windows file and credential custody
        run: >-
          python -m pytest -q
          tests/test_bootstrap_opened_file.py
          tests/test_bootstrap_permissions.py
          tests/test_control_plane_authorization.py
          tests/test_docker_disk_restore.py
          tests/test_mcp_auth_file.py
          tests/test_operator_config.py
          tests/test_propagation_fencing.py
          tests/router/test_keys.py
          tests/router/test_windows_sidecars.py
          -k "windows or selected_export_does_not_open_unselected_secret_identity"

  connect-linux:
    name: Connect native contracts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.0"

      - name: Run native internal and command contracts
        # The tunnel qualification package (./lab) needs a separately verified
        # pinned wstunnel binary. It remains an explicit evidence gate, not a
        # skipped CI qualification.
        run: go -C connect test ./internal/... ./cmd/anvil-connect -count=1

  connect-macos-client:
    name: Connect standalone client (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.0"
      - name: Test native client and secure local key output
        run: go -C connect test ./cmd/anvil-connect ./internal/clientconfig ./internal/client -count=1
      - name: Build standalone client
        run: go -C connect build -trimpath -o "$RUNNER_TEMP/anvil-connect" ./cmd/anvil-connect

  propagation-macos:
    name: Propagation native custody (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,hermes]"
      - name: Test native files and fenced catalogs without live clients
        run: python -m pytest tests/test_bootstrap_permissions.py tests/test_bootstrap_opened_file.py tests/test_propagation_fencing.py tests/test_client_catalog_sync.py -q

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # Rule scope is explicit in pyproject.toml; do not rely on version-specific defaults.
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check --config pyproject.toml .

  browser-owner:
    name: browser owner (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser_owner/package-lock.json
      - name: Install pinned browser owner dependencies
        run: npm ci --prefix browser_owner
      - name: Install Chromium for the real owner suite
        run: npm exec --prefix browser_owner -- playwright install --with-deps chromium
      - name: Run browser owner suite
        run: |
          cd browser_owner
          export CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          test -x "$CHROMIUM_EXECUTABLE"
          npm test

      - name: Test and pack observations library
        run: |
          node --test observation_core/png.test.mjs observation_core/owner.test.mjs
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          export pack_dir install_dir
          trap 'node --input-type=module -e "import { rmSync } from \"node:fs\"; rmSync(process.env.pack_dir, { recursive: true, force: true }); rmSync(process.env.install_dir, { recursive: true, force: true });"' EXIT
          npm pack --json --pack-destination "$pack_dir" > "$RUNNER_TEMP/observation-pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const expected = ["LICENSE", "README.md", "browser_owner/README.md", "browser_owner/jev_consumer.mjs", "browser_owner/live_adapter.mjs", "browser_owner/live_transport.mjs", "browser_owner/mediation_ledger.mjs", "browser_owner/owner.mjs", "browser_owner/owner_preview.mjs", "observation_core/README.md", "observation_core/owner.mjs", "observation_core/png.mjs", "package.json"]; const actual = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files.map((file) => file.path).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`unexpected package files: ${JSON.stringify(actual)}`);' "$RUNNER_TEMP/observation-pack.json"
          npm install "$pack_dir"/*.tgz --prefix "$install_dir" --ignore-scripts --offline --no-audit --no-fund
          (cd "$install_dir" && node --input-type=module -e 'await Promise.all([import("@anvil-serving/observations/owner"), import("@anvil-serving/observations/png"), import("@anvil-serving/observations/browser")]);')

  build:
    name: build + clean wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install "build==1.6.1" "twine==7.0.0"

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine metadata check
        run: python -m twine check dist/*

      - name: Clean-install smoke (fresh venv, Hermes dependency, exact versions, package data)
        run: python scripts/wheel_smoke.py

      - name: Journey smoke (quickstart and seven journeys in a clean container)
        if: runner.os == 'Linux'
        run: python scripts/journey_smoke.py

  mcp-bridge-bundle:
    name: mcp bridge bundle reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp_bridge/package-lock.json
      - name: Rebuild bundle from the lockfile
        run: |
          npm ci --prefix mcp_bridge
          npm run build --prefix mcp_bridge
      - name: Fail if the committed bundle differs from a clean rebuild
        run: git diff --exit-code -- anvil_serving/_node

  connect-govulncheck:
    name: connect govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # connect/go.mod only sets the 1.26.0 language floor. govulncheck also
          # scans the standard library of the toolchain that runs it, so this job
          # uses the latest 1.26 patch (what a release build should use) rather
          # than the floor; go.mod is unchanged.
          go-version: "1.26"
          check-latest: true
      - name: Scan connect/ dependencies and stdlib
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          cd connect && "$(go env GOPATH)/bin/govulncheck" ./...
