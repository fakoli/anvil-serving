name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-audit:
    name: docs audit (CLI references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Verify active CLI references (all scopes)
        # Sole home of the repo-level audit checks; the test suite keeps only
        # unit tests of the script so the matrix does not re-run these.
        run: |
          python scripts/audit_cli_references.py --check --scope docs
          python scripts/audit_cli_references.py --check --scope skills
          python scripts/audit_cli_references.py --check --scope full

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Boundary versions of the support envelope only; a middle version
        # adds a full-suite run without adding coverage for stdlib-only code.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Check Node.js
        run: node --version

      - name: Run Connect contracts before the full suite
        # Catch portable schema/renderer and platform-boundary regressions
        # before spending a complete Linux or Windows suite run.
        run: python -m pytest tests/connect/ -q

      - name: Run tests
        run: python -m pytest tests/ -x -q -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

  connect-linux:
    name: Connect native contracts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run native internal and command contracts
        # The tunnel qualification package (./lab) needs a separately verified
        # pinned wstunnel binary. It remains an explicit evidence gate, not a
        # skipped CI qualification.
        run: go -C connect test ./internal/... ./cmd/anvil-connect -count=1

      - name: Run Connect Python contracts
        # Browser qualification remains isolated because it requires its own
        # browser/identity fixture; these tests cover the portable CLI help and
        # Linux-owned lifecycle contracts without live systemd.
        run: python scripts/run_tests.py tests/connect/ -x -q

  connect-macos-client:
    name: Connect standalone client (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
      - name: Test native client and secure local key output
        run: go -C connect test ./cmd/anvil-connect ./internal/clientconfig ./internal/client -count=1
      - name: Build standalone client
        run: go -C connect build -trimpath -o "$RUNNER_TEMP/anvil-connect" ./cmd/anvil-connect

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # Rule scope is explicit in pyproject.toml; do not rely on version-specific defaults.
        run: python -m pip install ruff
      - name: Ruff check
        run: ruff check --config pyproject.toml .

  browser-owner:
    name: browser owner (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser_owner/package-lock.json
      - name: Install pinned browser owner dependencies
        run: npm ci --prefix browser_owner
      - name: Install Chromium for the real owner suite
        run: npm exec --prefix browser_owner -- playwright install --with-deps chromium
      - name: Run browser owner suite
        run: |
          cd browser_owner
          export CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')"
          test -x "$CHROMIUM_EXECUTABLE"
          npm test

      - name: Test and pack observations library
        run: |
          node --test observation_core/png.test.mjs observation_core/owner.test.mjs
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          export pack_dir install_dir
          trap 'node --input-type=module -e "import { rmSync } from \"node:fs\"; rmSync(process.env.pack_dir, { recursive: true, force: true }); rmSync(process.env.install_dir, { recursive: true, force: true });"' EXIT
          npm pack --json --pack-destination "$pack_dir" > "$RUNNER_TEMP/observation-pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const expected = ["LICENSE", "README.md", "browser_owner/README.md", "browser_owner/jev_consumer.mjs", "browser_owner/live_adapter.mjs", "browser_owner/live_transport.mjs", "browser_owner/mediation_ledger.mjs", "browser_owner/owner.mjs", "browser_owner/owner_preview.mjs", "observation_core/README.md", "observation_core/owner.mjs", "observation_core/png.mjs", "package.json"]; const actual = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files.map((file) => file.path).sort(); if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`unexpected package files: ${JSON.stringify(actual)}`);' "$RUNNER_TEMP/observation-pack.json"
          npm install "$pack_dir"/*.tgz --prefix "$install_dir" --ignore-scripts --offline --no-audit --no-fund
          (cd "$install_dir" && node --input-type=module -e 'await Promise.all([import("@anvil-serving/observations/owner"), import("@anvil-serving/observations/png"), import("@anvil-serving/observations/browser")]);')

  build:
    name: build + clean wheel smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine metadata check
        run: python -m twine check dist/*

      - name: Clean-install smoke (fresh venv, no deps, canonical entry point, package data)
        run: python scripts/wheel_smoke.py
