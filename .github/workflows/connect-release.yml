name: Connect release

# Builds the standalone Connect bundles for a published connect-v* release from
# the tagged source, signs each archive with Sigstore keyless signing (GitHub
# OIDC; no stored private key) and attaches archive, receipt and
# .sigstore.json bundle to that release. v* Anvil Serving releases never enter.
#
# connect/packaging/install.py pins this file's identity:
#   https://github.com/fakoli/anvil-serving/.github/workflows/connect-release.yml@refs/tags/connect-v<version>
# Renaming this file breaks verification of every later release.

on:
  release:
    types: [published]
  workflow_dispatch:   # recovery: select the connect-v* tag; the release must exist without these assets

permissions:
  contents: read

jobs:
  build:
    name: Build Connect bundles
    if: startsWith(github.ref, 'refs/tags/connect-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
          cache: false
      - name: Verify Connect release tag
        run: test "$GITHUB_REF_NAME" = "connect-v$(cat connect/VERSION)"
      - name: Fetch pinned Caddy, Authelia and wstunnel
        # Reuses the digest-verified fetcher from the qualification container.
        run: |
          python3 - "$RUNNER_TEMP/tools" "$RUNNER_TEMP/archives" <<'PY'
          import importlib.util, json, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('tools', 'connect/test/container/install_tools.py')
          tools = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tools)
          tools.TOOLS, archives = Path(sys.argv[1]), Path(sys.argv[2])
          tools.TOOLS.mkdir()
          archives.mkdir()
          for item in json.loads(Path('connect/lab/edge-tools.json').read_text())['components']:
              tools.fetch(item['url'], item['checksum']['algorithm'], item['checksum']['value'], archives / item['artifact'])
              tools.binary(archives / item['artifact'], item['name'], item['binary_sha256'])
          tunnel = json.loads(Path('connect/transport.lock.json').read_text())['artifacts']['linux/amd64']
          tools.fetch(tunnel['url'], 'sha256', tunnel['archive_sha256'], archives / 'wstunnel.tar.gz')
          tools.binary(archives / 'wstunnel.tar.gz', 'wstunnel', tunnel['binary_sha256'])
          PY
      - name: Build bundles from the tagged source
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir "$RUNNER_TEMP/dist"
          for target in linux-amd64 darwin-arm64 darwin-amd64; do
            components=()
            if [ "$target" = linux-amd64 ]; then
              components=(--caddy "$tools/caddy" --authelia "$tools/authelia" --wstunnel "$tools/wstunnel")
            fi
            out="$RUNNER_TEMP/out-$target"
            python3 connect/packaging/build_bundle.py --platform "$target" --output "$out" \
              --cache "$RUNNER_TEMP/cache" "${components[@]}"
            stem="anvil-connect-$(cat connect/VERSION)-$target"
            mv "$out/$stem.tar.gz" "$RUNNER_TEMP/dist/"
            mv "$out/receipt.json" "$RUNNER_TEMP/dist/$stem.receipt.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connect-release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  sign:
    name: Sign bundles (Sigstore keyless)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC token for the Sigstore signing certificate
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connect-release
          path: dist/
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4   # explicit; bump deliberately, never implicitly via the installer default
      - name: Sign each archive and verify the pinned identity
        env:
          IDENTITY: https://github.com/fakoli/anvil-serving/.github/workflows/connect-release.yml@${{ github.ref }}
        run: |
          for archive in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
            cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: connect-signatures
          path: dist/*.sigstore.json
          if-no-files-found: error

  attach:
    name: Attach signed bundles to the release
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release assets only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connect-release
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: connect-signatures
          path: dist/
      - name: Upload assets (never overwrites existing assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
