name: Docs

on:
  push:
    branches: [main]
  pull_request:

# Minimal read-only default; deploy job gets pages+id-token write via job-level override.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build (strict — fails on any warning)
        run: mkdocs build --strict

      - name: Check artifact-derived recipe report
        run: python -m anvil_serving.cli eval benchmark report docs/benchmarks/recipe-catalog.json --root . --output docs/benchmarks/recipe-results.md --check

      - name: Check tracked Markdown links
        run: python scripts/check_markdown_links.py --root .

      # Only upload the artifact when we are about to deploy (push to main).
      # PRs get the strict build check above but never upload.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # GitHub Actions OIDC token — required by actions/deploy-pages.
    # Flip the repo Pages source to "GitHub Actions" once this workflow lands.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
