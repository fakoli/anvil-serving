name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: public snapshot hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check semantic secrets and private operator identity
        run: |
          python .agents/skills/anvil-serving-secret-hygiene/scripts/semantic_secret_scan.py \
            --self-test
          python .agents/skills/anvil-serving-secret-hygiene/scripts/semantic_secret_scan.py \
            --scope tracked

      - name: Scan tracked snapshot with pinned Gitleaks
        run: |
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact=100 --config /repo/.gitleaks.toml /repo

      - name: Prove allowlists do not mask an adjacent generic key
        run: |
          probe_dir="$(mktemp -d)"
          mkdir -p "$probe_dir/docs/findings"
          probe_value="$(python -c 'import base64, hashlib; print(base64.urlsafe_b64encode(hashlib.sha512(b"anvil-gitleaks-adjacent-key-probe-v1").digest()).decode().rstrip("="))')"
          revision_field="tokenizer""_revision"
          revision_value="abcdef1234567890abcdef""1234567890abcdef12"
          key_field="api""_key"
          printf '{"%s":"%s","%s":"%s"}\n' \
            "$revision_field" "$revision_value" "$key_field" "$probe_value" \
            > "$probe_dir/docs/findings/adjacent-key.json"
          if docker run --rm --network none \
            --volume "$PWD:/repo:ro" \
            --volume "$probe_dir:/probe:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact=100 --config /repo/.gitleaks.toml /probe \
            >/dev/null 2>&1; then
            echo "Gitleaks allowlist masked the adjacent-key probe" >&2
            exit 1
          fi
