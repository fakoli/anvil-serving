name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: public snapshot hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check semantic secrets and private operator identity
        run: |
          python .agents/skills/anvil-serving-secret-hygiene/scripts/semantic_secret_scan.py \
            --scope tracked

      - name: Scan tracked snapshot with pinned Gitleaks
        run: |
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --no-banner --redact=100 --config /repo/.gitleaks.toml /repo
