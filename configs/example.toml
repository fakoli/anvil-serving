# anvil-serving direct capability-gateway configuration.
#
# The model aliases in [router.model_routes] are the complete chat vocabulary.
# Unknown aliases return 404; they are never classified or rerouted.  `auth_env`
# names an environment variable, never a literal secret.
claude_logs = "~/.claude/projects"
hf_extra_roots = []
model_dirs = []
gpu_index = 0
served_model_name = "local-specialist"

[router]
relay_timeout = 20
availability_probe_interval = 5
availability_probe_timeout = 1

[[router.tiers]]
id = "heavy-local"
base_url = "http://127.0.0.1:30000/v1"
model = "qwen35-awq-local"
dialect = "openai"
context_limit = 131072
privacy = "local"
tool_support = true
auth_env = "ANVIL_HEAVY_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "fast-local"
base_url = "http://127.0.0.1:30001/v1"
model = "gpt-oss-20b"
dialect = "openai"
context_limit = 32768
privacy = "local"
tool_support = true
auth_env = "ANVIL_FAST_LOCAL_KEY"
health_path = "/health"

# Caller model alias -> exactly one local chat tier.
[router.model_routes]
llm.primary = "heavy-local"
llm.voice = "fast-local"

# Optional deterministic purpose-model routes.  They have their own endpoints:
