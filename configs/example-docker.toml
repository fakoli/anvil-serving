# Direct capability gateway for a router container on the same Compose network.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
availability_probe_interval = 5
availability_probe_timeout = 1

[[router.tiers]]
id = "heavy-local"
base_url = "http://sglang:30000/v1"
model = "qwen35-awq-local"
dialect = "openai"
context_limit = 131072
privacy = "local"
tool_support = true
auth_env = "ANVIL_HEAVY_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "fast-local"
base_url = "http://fast:30001/v1"
model = "gpt-oss-20b"
dialect = "openai"
context_limit = 32768
privacy = "local"
tool_support = true
auth_env = "ANVIL_FAST_LOCAL_KEY"
health_path = "/health"

[router.model_routes]
llm.primary = "heavy-local"
llm.voice = "fast-local"
