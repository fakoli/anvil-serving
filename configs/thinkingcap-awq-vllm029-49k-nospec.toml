schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ"
status = "qualification-candidate"
source = "2026-09-23 ThinkingCap AWQ campaign; complete vision weights required"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ"
revision = "f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "One dedicated GPU; 10% runtime allocation margin. Startup and modality feasibility remain unmeasured."

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai:v0.29.0@sha256:082ca6f035279109041ffd3fe0695cb568b29bc580b35c4f297a66a08b216c1b"
entrypoint = ["python3", "-m", "vllm.entrypoints.openai.api_server"]
model_flag = "--model"
model_path = "/root/.cache/huggingface/hub/models--bottlecapai--ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ/snapshots/f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"
quantization = "NVFP4 W4A4 AWQ mixed with FP8 and BF16; vision and MTP BF16; MTP disabled"
context_tokens = 49152
port = 39283
health = "/health"
startup_timeout_seconds = 2400
served_model_name = "thinkingcap-awq-49k-nospec"
ipc = "host"
shm_size = "32gb"
named_volumes = ["thinkingcap-vllm029:/root/.cache/vllm"]
env = ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "PYTHONHASHSEED=0", "MAX_JOBS=2"]
flags = [
  "--served-model-name thinkingcap-awq-49k-nospec",
  "--tensor-parallel-size 1",
  "--max-model-len 49152",
  "--max-num-seqs 8",
  "--gpu-memory-utilization 0.90",
  "--kv-cache-dtype auto",
  "--no-enable-prefix-caching",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_xml",
  "--limit-mm-per-prompt '{\"image\":2,\"video\":0}'",
  "--generation-config vllm",
  "--host 0.0.0.0",
  "--port 39283",
]
note = "Initial scout only, not qualified or promoted. Configured to admit up to two images; vision capability remains unqualified pending preflight. No speculative decoding; paired MTP arm must explicitly select TRITON_ATTN for draft attention."

[recipe.fit]
suited = ["qualification-candidate"]
not_suited = ["automatic-promotion", "video", "unmeasured-long-context"]
rationale = "Preserves the complete checkpoint and isolates a conservative no-spec baseline before measured optimization."

[recipe.sources]
official = ["https://huggingface.co/bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ/tree/f8fe157f207a13f977bc3d620ce10a3e9ba5ab11", "https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.29.0"]
community = []
