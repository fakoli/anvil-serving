named_volumes = ["qwen38-gittensor-sglang-0518:/root/.cache/sglang"]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_USE_CUDA_IPC_TRANSPORT=0",
  "SGLANG_VIT_ENABLE_CUDA_GRAPH=0",
  "SGLANG_MM_BUFFER_SIZE_MB=0",
]
flags = [
  "--served-model-name qwen38-27b-gittensor-nvfp4-nospec-262k",
  "--trust-remote-code",
  "--tp-size 1",
  "--context-length 262144",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--mamba-radix-cache-strategy extra_buffer_lazy",
  "--mamba-ssm-dtype bfloat16",
  "--mem-fraction-static 0.90",
  "--max-running-requests 2",
  "--max-mamba-cache-size 12",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--host 0.0.0.0",
  "--port 8081",
]
note = "Publisher-advertised full-native-context SGLang control at 262,144 tokens. The publisher separately reports capacity for a 320,960-token KV pool, but the checkpoint declares 262,144 native context and SGLang correctly requires an explicit unsafe override above it. This recipe preserves the native model contract and records spare KV separately. No route or promotion authority."

[recipe.fit]
suited = ["single-gpu", "long-context", "matched-control", "tool-use"]
not_suited = ["automatic-promotion", "native-mtp"]
rationale = "Small target checkpoint with the upstream MTP head removed; intended to maximize usable target KV before the matched DSpark comparison."

