[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "Dedicated TP=1 qualification lane after an explicitly authorized bounded interruption."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang@sha256:616a3e97f45191af975896cfa644279096cb31bd408a071c2e99ca7209c3cafe"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--Inferact--Qwen3.8-27B-NVFP4/snapshots/6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
quantization = "ModelOpt NVFP4 W4A4 target with FP8 projections and explicit FP8 E4M3 target KV cache"
context_tokens = 262144
port = 39263
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-inferact-nvfp4-sglang-pro6000-current-nospec"
ipc = "host"
shm_size = "32gb"
named_volumes = ["qwen38-pro6000-dflash2-sglang-cache:/root/.cache/sglang"]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_USE_CUDA_IPC_TRANSPORT=0",
]
flags = [
  "--served-model-name qwen38-27b-inferact-nvfp4-sglang-pro6000-current-nospec",
  "--tp-size 1",
  "--language-only",
  "--context-length 262144",
  "--max-running-requests 8",
  "--cuda-graph-max-bs 8",
  "--mem-fraction-static 0.85",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-prefill-cuda-graph",
  "--disable-flashinfer-autotune",
  "--mamba-radix-cache-strategy extra_buffer",
  "--mamba-ssm-dtype bfloat16",
  "--max-mamba-cache-size 16",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--enable-metrics",
  "--host 0.0.0.0",
  "--port 39263",
]
note = "Storage-aware first live control for the comprehensive PRO 6000 campaign. The exact Inferact revision is already cached, safety-audited, and previously qualified on both equal cards. This recipe changes the runtime and workload envelope to the current DFlash2-capable official SGLang image, keeps speculation disabled, and otherwise matches the paired DFlash2 recipe. C8 is an admission ceiling; long-context concurrency advances only after startup-reported KV/state pools and the conservative feasibility screen are reconciled. Direct-only; no route or promotion authority."

[recipe.fit]
suited = ["qualification", "latency", "prefill", "concurrency", "long-context", "text", "coding", "agentic"]
rationale = "Establishes the matched current-runtime baseline without downloading a redundant target checkpoint during a storage-constrained campaign."

