schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "Inferact/Qwen3.8-27B-NVFP4"
status = "qualification-candidate"
source = "2026-08-15 SGLang RTX PRO 6000 NVFP4 recipe translated to the existing TP1 393K no-speculation control shape"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "Inferact/Qwen3.8-27B-NVFP4"
revision = "6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "One GPU in split mode; the other equal GPU remains independently assigned."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang@sha256:506525a5907ea22c9d445afb7c03603959b912de034d86915cf17da814f1a124"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--Inferact--Qwen3.8-27B-NVFP4/snapshots/6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
quantization = "ModelOpt NVFP4 W4A4 with FP8 projections and explicit FP8 E4M3 KV cache"
context_tokens = 393216
port = 39212
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-inferact-nvfp4-sglang-tp1-393k-control"
ipc = "host"
shm_size = "32gb"
named_volumes = [
  "qwen38-nvfp4-sglang-cache:/root/.cache/sglang",
]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1",
]
flags = [
  "--served-model-name qwen38-27b-inferact-nvfp4-sglang-tp1-393k-control",
  "--tp-size 1",
  "--language-only",
  "--context-length 393216",
  "--max-running-requests 1",
  "--mem-fraction-static 0.85",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-radix-cache",
  "--max-mamba-cache-size 1",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--host 0.0.0.0",
  "--port 39212",
]
note = "Matched SGLang no-speculation control for the TP1 393K campaign. The upstream RTX PRO 6000 cell was published for RadixArk NVFP4; this lane substitutes the operator-approved Inferact ModelOpt NVFP4 snapshot while holding the runtime and launch shape fixed. Safety intake found only Safetensors weights plus data/config/template files: all seven Safetensors headers parsed, tensor ranges were valid and complete, and the snapshot contains no tracked Python, native executable, auto_map, PyTorch pickle, or remote-code hook. Repository crc32.txt is stale and safetensors-md5sum.txt is empty, so the immutable Hugging Face revision and LFS object identities are the authoritative provenance anchors. This recipe deliberately omits --trust-remote-code. SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1 is SGLang's explicit opt-in for the matched 393K campaign window above the advertised 262K native limit. --language-only matches the existing FP8 text control and avoids SGLang's WSL2-incompatible default CUDA-IPC multimodal warmup path; multimodal qualification requires a separate CPU-feature-transport recipe. The default chat-template kwargs keep thinking disabled across both Chat Completions and the Responses adapter. Prefix caching is disabled and one GDN state slot is allocated for the c1 no-shared-prefix workload. A model-specific named volume retains generated SGLang/FlashInfer caches across card-swap restarts without sharing writes between models. The immutable image label reports SGLang c4271c3fe1262fc2adbd162c33b25de5255251c5 while an internal build-version string reports 561c8f3; retain that discrepancy as a caveat. Router and promotion state remain out of scope."

[recipe.fit]
suited = ["qualification", "long-context", "text", "coding", "agentic"]
rationale = "Tests whether a substantially smaller ModelOpt NVFP4 snapshot improves speed and headroom on one SM120 card without losing functional or long-context correctness."

[recipe.sources]
official = [
  "https://github.com/sgl-project/sglang/blob/dd458f3212dd4ddf0e1a7907bbf539b660e70d21/docs/cookbook/autoregressive/Qwen/Qwen3.8-27B.mdx",
  "https://github.com/sgl-project/sglang/blob/dd458f3212dd4ddf0e1a7907bbf539b660e70d21/docs/src/snippets/configs/Qwen/qwen3.8-27b.jsx",
]
community = [
  "https://huggingface.co/Inferact/Qwen3.8-27B-NVFP4/tree/6128240ebaf4eaa7bad2b3d1c72c37d677c5f462",
]
local = [
  "configs/qwen38-27b-inferact-nvfp4-sglang-tp1-393k-control-recipe.toml",
  "configs/qwen38-27b-official-fp8-sglang-tp1-393k-control-recipe.toml",
  "docs/findings/2026-08-15-qwen38-27b-external-recipe-refresh.md",
  "docs/findings/2026-08-15-qwen38-27b-sglang-nvfp4-qualification.md",
]
