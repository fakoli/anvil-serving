schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "qualification-candidate"
source = "2026-08-10 quality-first 393216-token r33 target-only candidate translated from the pinned upstream r33 release"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. Capacity is sharded, not unified."

[recipe.serve]
engine = "vllm-r33-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:fdde59fed7f9fc12f9fd5ef1b3b3ea8d5097bf10ebad54b348497102c3a83f82"
entrypoint = ["/usr/local/bin/serve-ds4-flash.sh"]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-r33-quality-jit:/cache",
  "deepseek-v4-0731-r33-quality-tmp:/container-tmp",
]
quantization = "Released 0731 checkpoint through B12X W4A8 kernels; NVFP4 MoE weights, FP8 activations/dense path, and FP8 DS-MLA KV"
context_tokens = 393216
port = 39074
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-r33-b12x-nospec-maxseq1-tp2-393k"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39074",
  "MODE=dspark-mtp0",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "ALLREDUCE_MODE=auto",
  "B12X_PCIE_TP2_REMOTE_PUSH=0",
  "GRAPH=auto",
  "MAX_NUM_SEQS=1",
  "MAX_MODEL_LEN=393216",
  "MAX_NUM_BATCHED_TOKENS=4096",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "KV_OFFLOADING_SIZE=16",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-r33-b12x-nospec-maxseq1-tp2-393k",
]
flags = []
note = "Quality-first single-user long-context candidate. The 393216-token envelope leaves room for a prompt above 300000 tokens plus a visible answer and reasoning headroom. Target-only MODE=dspark-mtp0 removes speculative-decoding variance; MAX_NUM_SEQS=1 and the 4096-token batching budget reduce concurrency and transient-memory pressure. FP8 DS-MLA KV is retained because no controlled 0731 evidence currently shows NVFP4 KV preserves quality above 300K. The r33 131K control exposed a 283917-token GPU KV pool, so this recipe adds a 16 GiB native host-memory KV tier; no filesystem L2 tier is enabled. In exclusive AI-only mode there is no separate video-workload VRAM reserve gate, but startup health, allocator stability, both-card memory use, host-memory ownership, and clean mmap lifecycle remain measured acceptance evidence. This configuration must pass the 131K compatibility control, prompt-template fingerprints, protocol gates, cold long-context capacity, repeated quality, and stability soak before K5 is tested. It is not promotion authority."

[recipe.fit]
suited = ["qualification", "long-context", "coding-agent", "single-user"]
rationale = "Maximizes quality and stability at greater than 300K prompt depth by retaining the released checkpoint and FP8 KV, adding only the measured host-KV capacity needed for the target, and removing speculative decoding and concurrency pressure."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731/tree/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
]
community = [
  "https://github.com/local-inference-lab/rtx6kpro/blob/6c111c20c2bf2efec038e4daf14fc67030717e46/models/ds4dspark-v20-r33.md",
  "https://github.com/local-inference-lab/blackwell-llm-docker/blob/426da51285d0666508003b03a75a442139fb7979/examples/docker-compose-ds4-v20-r33.yml",
]
local = [
  "configs/deepseek-v4-flash-0731-r33-b12x-nospec-maxseq1-131k-recipe.toml",
  "configs/deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-650k-recipe.toml",
]
