  "--served-model-name qwen38-27b-unsloth-nvfp4-mtp3-64k",
  "--trust-remote-code",
  "--quantization compressed-tensors",
  "--max-model-len 65536",
  "--max-num-seqs 2",
  "--gpu-memory-utilization 0.90",
  "--kv-cache-dtype fp8",
  "--speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}'",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_xml",
  "--generation-config vllm",
  "--host 0.0.0.0",
  "--port 8081",
]
note = "Publisher-shipped MTP3 arm, otherwise matched to the target-only control. Community evidence says vLLM 0.27.2 or newer repairs a long-context MTP crash; this pinned 0.27.1 intake must fail closed if the exact arm is incompatible."

[recipe.fit]
suited = ["single-gpu-intake", "speculative-decoding", "64k-context", "developer-role"]
not_suited = ["automatic-promotion", "full-native-context", "vllm-main-equivalence"]
rationale = "Measures whether the newly published official Unsloth MTP files improve the target on the same local runtime and bounded context."

