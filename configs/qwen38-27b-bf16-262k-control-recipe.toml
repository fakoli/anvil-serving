context_tokens = 262144
port = 39080
startup_timeout_seconds = 1800
served_model_name = "qwen38-27b-bf16-262k"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
]
flags = [
  "--revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0",
  "--served-model-name qwen38-27b-bf16-262k",
  "--tensor-parallel-size 1",
  "--dtype bfloat16",
  "--kv-cache-dtype fp8",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--limit-mm-per-prompt '{\"image\":4,\"video\":1}'",
  "--media-io-kwargs '{\"video\":{\"num_frames\":-1}}'",
  "--enable-chunked-prefill",
  "--no-enable-prefix-caching",
  "--max-model-len 262144",
  "--max-num-seqs 2",
  "--max-num-batched-tokens 4096",
  "--gpu-memory-utilization 0.90",
  "--host 0.0.0.0",
  "--port 39080",
]
note = "Exact managed restoration target for the previously qualified BF16 multimodal lane; no route or promotion semantics."

[recipe.fit]
suited = ["qualification", "long-context", "multimodal", "coding", "agentic"]
