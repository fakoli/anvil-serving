schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "Qwen/Qwen3.8-27B"
status = "qualification-candidate"
source = "2026-08-15 matched SGLang TP1 393K MTP=3 BF16 multimodal comparison arm"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "Qwen/Qwen3.8-27B"
revision = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "One GPU in split mode; multimodal feature transfer uses host memory rather than CUDA IPC."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang@sha256:506525a5907ea22c9d445afb7c03603959b912de034d86915cf17da814f1a124"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--Qwen--Qwen3.8-27B/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
quantization = "official BF16 weights with explicit FP8 E4M3 KV cache"
context_tokens = 393216
port = 39217
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-official-bf16-sglang-tp1-393k-mtp3-mm-cpu"
ipc = "host"
shm_size = "32gb"
named_volumes = [
  "qwen38-bf16-sglang-cache:/root/.cache/sglang",
]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1",
  "SGLANG_USE_CUDA_IPC_TRANSPORT=0",
  "SGLANG_VIT_ENABLE_CUDA_GRAPH=0",
  "SGLANG_MM_BUFFER_SIZE_MB=0",
]
flags = [
  "--served-model-name qwen38-27b-official-bf16-sglang-tp1-393k-mtp3-mm-cpu",
  "--tp-size 1",
  "--dtype bfloat16",
  "--mm-feature-transport cpu",
  "--context-length 393216",
  "--max-running-requests 1",
  "--mem-fraction-static 0.85",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-radix-cache",
  "--max-mamba-cache-size 5",
  "--speculative-algorithm EAGLE",
  "--speculative-num-steps 3",
  "--speculative-eagle-topk 1",
  "--speculative-num-draft-tokens 4",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--host 0.0.0.0",
  "--port 39217",
]
note = "Matched BF16 arm for the SGLang multimodal quantization comparison. Image, TP, context, concurrency, KV dtype, attention, prefill, cache policy, Mamba cache, MTP, parsers, thinking mode, and CPU feature transport are held fixed against the official-FP8 and Inferact-NVFP4 multimodal recipes. It is a qualification candidate, not a promotion recipe."

[recipe.fit]
suited = ["qualification", "long-context", "multimodal", "vision", "ocr", "speculative-decoding"]
rationale = "Provides the higher-precision control needed to isolate checkpoint precision from SGLang engine and transport differences."

[recipe.sources]
official = [
  "https://github.com/sgl-project/sglang/blob/dd458f3212dd4ddf0e1a7907bbf539b660e70d21/docs/cookbook/autoregressive/Qwen/Qwen3.8-27B.mdx",
  "https://github.com/sgl-project/sglang/blob/c4271c3fe1262fc2adbd162c33b25de5255251c5/python/sglang/srt/server_args.py",
  "https://github.com/sgl-project/sglang/pull/33899",
  "https://huggingface.co/Qwen/Qwen3.8-27B/tree/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0",
]
local = [
  "configs/qwen38-27b-bf16-tp1-393k-mtp3-recipe.toml",
  "configs/qwen38-27b-official-fp8-sglang-tp1-393k-mtp3-mm-cpu-recipe.toml",
  "configs/qwen38-27b-inferact-nvfp4-sglang-tp1-393k-mtp3-mm-cpu-recipe.toml",
  "docs/findings/2026-08-15-qwen38-27b-sglang-mtp-multimodal-qualification.md",
]
