schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "qualification-candidate"
source = "2026-08-01 dual RTX PRO 6000 exact-release TP2 campaign"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "7872f01b1d1fe23eabc4c98b48bffcef5a386062"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. Pass both GPU UUIDs through --gpu-device at load time."

[recipe.serve]
engine = "sglang"
allow_cuda_visible_devices_index = true
image = "anvil-sglang@sha256:0aa5324c4f38bc66f4b55e1e12efab821ef614b1a8629259b2810ff72a6570e6"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
quantization = "publisher hybrid: FP4 experts and FP8 quantization"
context_tokens = 32768
port = 39050
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-tp2"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
]
flags = [
  "--revision 7872f01b1d1fe23eabc4c98b48bffcef5a386062",
  "--served-model-name deepseek-v4-flash-0731-tp2",
  "--trust-remote-code",
  "--tp 2",
  "--moe-runner-backend flashinfer_mxfp4",
  "--kv-cache-dtype fp8_e4m3",
  "--disable-cuda-graph",
  "--disable-custom-all-reduce",
  "--chunked-prefill-size 8192",
  "--max-prefill-tokens 8192",
  "--context-length 32768",
  "--max-running-requests 1",
  "--mem-fraction-static 0.94",
  "--reasoning-parser deepseek-v4",
  "--tool-call-parser deepseekv4",
  "--host 0.0.0.0",
  "--port 39050",
]
note = "Exact-0731 TP2 lane. Derived from SGLang sha256:984699c2... with only the WSL2-incompatible symmetric-memory logits optimization disabled in favor of its NCCL fallback. The pinned CUDA DeepSeek V4 memory pool requires FP8 E4M3 KV storage and reports missing checkpoint scaling factors; treat this as an accuracy caveat. No speculative decoding, HiSparse, or third-party conversion is enabled."

[recipe.fit]
suited = ["qualification", "agentic", "coding", "reasoning", "tool-use"]
rationale = "Tests the newest publisher checkpoint on the workstation's symmetric exclusive TP2 topology."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731",
  "https://docs.sglang.io/cookbook/autoregressive/DeepSeek/DeepSeek-V4.html",
  "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4",
]

