schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "RadixArk/Qwen3.8-27B-NVFP4-PRO6000-C8-NoSpec"
status = "qualification-candidate"
source = "2026-09-04 current SGLang Qwen3.8 DFlash2 image translated into a matched RTX PRO 6000 no-speculation control"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "RadixArk/Qwen3.8-27B-NVFP4"
revision = "319f741cce68d7914884900c138a1fbb70a42f30"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "One card in a dedicated TP=1 qualification lane; the paired card is tested separately before any TP=2 comparison."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang@sha256:616a3e97f45191af975896cfa644279096cb31bd408a071c2e99ca7209c3cafe"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/319f741cce68d7914884900c138a1fbb70a42f30"
quantization = "ModelOpt NVFP4 W4A4 target including the restored quantized LM head, with FP8 E4M3 target KV cache"
context_tokens = 262144
port = 39260
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-radixark-nvfp4-sglang-pro6000-c8-nospec"
ipc = "host"
shm_size = "32gb"
named_volumes = [
  "qwen38-pro6000-dflash2-sglang-cache:/root/.cache/sglang",
]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_USE_CUDA_IPC_TRANSPORT=0",
]
flags = [
  "--served-model-name qwen38-27b-radixark-nvfp4-sglang-pro6000-c8-nospec",
  "--tp-size 1",
  "--language-only",
  "--context-length 262144",
  "--max-running-requests 8",
  "--cuda-graph-max-bs 8",
  "--mem-fraction-static 0.85",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-prefill-cuda-graph",
  "--disable-flashinfer-autotune",
  "--mamba-radix-cache-strategy extra_buffer",
  "--mamba-ssm-dtype bfloat16",
  "--max-mamba-cache-size 16",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--enable-metrics",
  "--host 0.0.0.0",
  "--port 39260",
]
note = "Matched no-speculation control for the 2026-09-04 RTX PRO 6000 possibility campaign. The image is the immutable multi-architecture digest whose amd64 manifest is b91d664a8e4825afc16ab831c6035a6c88ac20ef8bd26da4fe2b9813a9f44376 and whose OCI labels identify SGLang source 5f55db35e926d50676f75b812640ea2410b0fe0e. The target revision restores the quantized LM head after current upstream DFlash2 support removed the earlier dense-head restriction. This arm deliberately shares the DFlash arm's runtime, target, context, C8 scheduler, CUDA graph ceiling, memory fraction, FP8 target KV, attention backend, 2K chunked prefill, disabled prefill graph, deterministic FlashInfer setting, BF16 SSM state, parsers, and thinking-disabled default. The Mamba slot count is the no-speculation allocation needed for eight requests with the extra-buffer strategy. It is direct-only and carries no route or promotion authority."

[recipe.fit]
suited = ["qualification", "latency", "prefill", "concurrency", "long-context", "text", "coding", "agentic"]
rationale = "Provides the matched autoregressive control needed to attribute DFlash2 and compile gains while exercising practical C1-C8 admission on one 96 GB SM120 card."

