schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "qualification-candidate"
source = "2026-08-02 translation of local-inference-lab's pinned r16 native CPU KV offload release"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. Native CPU KV offload is translated to the Docker Desktop WSL2 memory boundary and must be measured locally."

[recipe.serve]
engine = "vllm-r16-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:48518e91cf87dd0c0483c76ff86e81dfc0f46de7e364b46f7a82c481ce08188f"
entrypoint = ["/usr/local/bin/serve-ds4-flash.sh"]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-r16-jit:/cache",
  "deepseek-v4-0731-r16-tmp:/container-tmp",
]
quantization = "Official 0731 mixed FP8/FP4 checkpoint; B12X W4A8 NVFP4 MoE, B12X FP8 dense GEMM, FP8 KV"
context_tokens = 131072
port = 39064
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-r16-b12x-dspark5-offload8-tp2-128k"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39064",
  "MODE=dspark",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "DSPARK_DEPTH_MODE=fixed",
  "DSPARK_TOKENS=5",
  "DRAFT_SAMPLE_METHOD=probabilistic",
  "REJECTION_SAMPLE_METHOD=standard",
  "MAX_NUM_SEQS=8",
  "MAX_MODEL_LEN=131072",
  "MAX_NUM_BATCHED_TOKENS=8192",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "KV_OFFLOADING_SIZE=8",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SPEC_MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-r16-b12x-dspark5-offload8-tp2-128k",
]
flags = []
note = "Controlled native CPU KV offload experiment against the published no-offload r16 DSpark K5 baseline. The 8 GiB size fits the observed 64 GiB Docker Desktop VM and 31.4 GiB host IPC filesystem; upstream's 48.5 GiB example is not assumed safe here. Exact image, model revision, B12X path, K5 depth, TP2, context, batching, admission, and WSL2 NCCL/allocator translation remain fixed. This lane must prove real store/replay counters, coherent output, WSL memory behavior, GPU headroom, decode impact, and cleanup of /dev/shm/vllm_offload_*.mmap after managed removal. It does not authorize production promotion or infer 256K support."

[recipe.fit]
suited = ["qualification", "speculative-decoding", "native-kv-offload", "long-context", "coding-agent"]
rationale = "Tests whether the r16 process-shared native CPU KV region improves repeated-prefix and long-context operation on WSL2 without decode regression or cleanup leaks."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731/tree/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
]
community = [
  "https://github.com/local-inference-lab/rtx6kpro/blob/7ffa54e28da423200855d1792b485f9e84648232/models/ds4dspark-v20.md",
  "https://github.com/local-inference-lab/blackwell-llm-docker/blob/c12011b4c5edffceb350ba9d39d48ac0b2562452/examples/docker-compose-ds4-v20-r16.yml",
  "https://github.com/local-inference-lab/blackwell-llm-docker/blob/c12011b4c5edffceb350ba9d39d48ac0b2562452/manifests/vllm/gilded-gnosis-v20.json",
]
local = [
  "configs/deepseek-v4-flash-0731-r16-b12x-dspark5-128k-recipe.toml",
  "docs/findings/2026-08-01-deepseek-v4-flash-0731-r16-dspark-qualification.md",
]
