schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "qualification-candidate"
source = "2026-08-01 translation of Zeeksa's pinned local-inference-lab r16 SM120 TP2 DSpark result"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. External evidence used 600 W cards, so local Max-Q clocks and power are measured separately."

[recipe.serve]
engine = "vllm-r16-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:48518e91cf87dd0c0483c76ff86e81dfc0f46de7e364b46f7a82c481ce08188f"
entrypoint = ["/usr/local/bin/serve-ds4-flash.sh"]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-r16-jit:/cache",
  "deepseek-v4-0731-r16-tmp:/container-tmp",
]
quantization = "Official 0731 mixed FP8/FP4 checkpoint; B12X W4A8 NVFP4 MoE, B12X FP8 dense GEMM, FP8 KV"
context_tokens = 131072
port = 39062
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-r16-b12x-dspark5-tp2-128k"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39062",
  "MODE=dspark",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "DSPARK_DEPTH_MODE=fixed",
  "DSPARK_TOKENS=5",
  "DRAFT_SAMPLE_METHOD=probabilistic",
  "REJECTION_SAMPLE_METHOD=standard",
  "MAX_NUM_SEQS=8",
  "MAX_MODEL_LEN=131072",
  "MAX_NUM_BATCHED_TOKENS=8192",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "KV_OFFLOADING_SIZE=0",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SPEC_MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-r16-b12x-dspark5-tp2-128k",
]
flags = []
note = "Separate performance candidate; never retag over the preserved FlashInfer DSpark image. Registry digest and source commit are pinned, but the upstream repository has no root license file at that revision. Complete-cache offline mode requires both MODEL_PATH and SPEC_MODEL_PATH to identify the exact local snapshot because vLLM does not rewrite the nested DSpark speculative-config model id. The image defaults to NCCL_P2P_LEVEL=SYS and PyTorch expandable segments; the managed WSL2 translation disables direct P2P and NCCL cuMem device/host allocation, retains shared-memory transport, and selects the native PyTorch allocator contract already proven on this workstation. Local CUDA-graph profiling at max_num_seqs=16 reserved about 0.88 GiB per rank and left the 131K KV gate short by 0.15 GiB, so the single-stream qualification profile uses max_num_seqs=8 and graph cap 48 while preserving K5, 8K batching, and 0.975 utilization. The translated lane completes 128K requests but fails the separate 3 GiB reported-free physical-reserve gate under WSL/WDDM and remains no-promotion. Privileged mode and host networking remain omitted unless lower-level evidence proves either is required; TP ranks share one container and the API remains loopback-bound. Model, JIT, and temporary build data live only in named Docker volumes."

[recipe.fit]
suited = ["qualification", "speculative-decoding", "long-context", "coding-agent"]
rationale = "Tests whether the B12X/InstantTensor SM120 stack reproduces the external 230-250 tok/s and 131K claims on two lower-power Max-Q cards."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731/tree/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
]
community = [
