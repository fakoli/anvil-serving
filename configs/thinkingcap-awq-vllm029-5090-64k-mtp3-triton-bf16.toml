    "unqualified-long-context",
    "video",
  ]
  rationale = "Context expansion from qualified 32K: maximum context65536 and memory fraction0.90. Retain BF16 cache, MTP3, full vision, and at least2048MiB sampled free memory; compare actual requests before recommendation."

