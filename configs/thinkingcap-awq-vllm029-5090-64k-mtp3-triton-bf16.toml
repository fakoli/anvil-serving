  quantization = "NVFP4 W4A4 AWQ mixed FP8/BF16; BF16 vision and MTP weights; explicit target TRITON_ATTN; target and draft KV inherit the declared dtype"
  context_tokens = 65536
  port = 39283
  health = "/health"
  startup_timeout_seconds = 2400
  served_model_name = "thinkingcap-awq-5090"
  ipc = "host"
  shm_size = "8gb"
  named_volumes = ["thinkingcap-vllm029-5090:/root/.cache/vllm"]
  env = [
    "CUDA_DEVICE_ORDER=PCI_BUS_ID",
    "PYTHONHASHSEED=0",
    "MAX_JOBS=2",
    "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  ]
  flags = [
    "--served-model-name thinkingcap-awq-5090",
    "--tensor-parallel-size 1",
    "--max-model-len 65536",
    "--max-num-seqs 1",
    "--max-num-batched-tokens 1024",
    "--gpu-memory-utilization 0.90",
    "--kv-cache-dtype bfloat16",
    "--attention-backend TRITON_ATTN",
    "--no-enable-prefix-caching",
    "--speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3,\"attention_backend\":\"TRITON_ATTN\"}'",
    "--reasoning-parser qwen3",
    "--enable-auto-tool-choice",
    "--tool-call-parser qwen3_xml",
    "--limit-mm-per-prompt '{\"image\":2,\"video\":0}'",
    "--mm-processor-kwargs '{\"size\":{\"longest_edge\":1048576,\"shortest_edge\":65536}}'",
    "--generation-config vllm",
    "--host 0.0.0.0",
    "--port 39283",
  ]
  note = "64K C1 MTP3 with explicit target TRITON_ATTN and bfloat16 KV. Standard V2 MTP inherits target attention/cache configuration; nested drafter backend alone is not proof of effect. Qualification candidate; full vision remains mandatory."

  [recipe.fit]
