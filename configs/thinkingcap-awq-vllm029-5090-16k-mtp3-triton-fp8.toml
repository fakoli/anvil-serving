schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ"
status = "calibration-candidate"
source = "2026-09-23 RTX5090 target-Triton fp8 controlled cache experiment"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ"
revision = "f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA GeForce RTX 5090"
arch = "sm_120"
vram_total_gb = 32
vram_note = "Prior target-Flash MTP3 has 44,683 BF16 cache tokens. Explicit target-Triton backend and KV format require new physical calibration."

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai:v0.29.0@sha256:082ca6f035279109041ffd3fe0695cb568b29bc580b35c4f297a66a08b216c1b"
entrypoint = ["python3", "-m", "vllm.entrypoints.openai.api_server"]
model_flag = "--model"
model_path = "/root/.cache/huggingface/hub/models--bottlecapai--ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ/snapshots/f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"
quantization = "NVFP4 W4A4 AWQ mixed FP8/BF16; BF16 vision and MTP weights; explicit target TRITON_ATTN; target and draft KV inherit the declared dtype"
context_tokens = 16384
port = 39283
health = "/health"
startup_timeout_seconds = 2400
served_model_name = "thinkingcap-awq-5090"
ipc = "host"
shm_size = "8gb"
named_volumes = ["thinkingcap-vllm029-5090:/root/.cache/vllm"]
env = ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "PYTHONHASHSEED=0", "MAX_JOBS=2", "VLLM_WSL2_ENABLE_PIN_MEMORY=1"]
flags = [
  "--served-model-name thinkingcap-awq-5090",
  "--tensor-parallel-size 1",
  "--max-model-len 16384",
  "--max-num-seqs 1",
  "--max-num-batched-tokens 1024",
  "--gpu-memory-utilization 0.87",
  "--kv-cache-dtype fp8_per_token_head",
  "--attention-backend TRITON_ATTN",
  "--no-enable-prefix-caching",
  "--speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3,\"attention_backend\":\"TRITON_ATTN\"}'",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_xml",
  "--limit-mm-per-prompt '{\"image\":2,\"video\":0}'",
  "--mm-processor-kwargs '{\"size\":{\"longest_edge\":1048576,\"shortest_edge\":65536}}'",
  "--generation-config vllm",
  "--host 0.0.0.0",
  "--port 39283",
]
note = "16K C1 MTP3 with explicit target TRITON_ATTN and fp8_per_token_head KV. Standard V2 MTP inherits target attention/cache configuration; nested drafter backend alone is not proof of effect. Qualification candidate; full vision remains mandatory."

[recipe.fit]
suited = ["memory-calibration", "qualification-candidate"]
not_suited = ["automatic-promotion", "unqualified-long-context", "video"]
rationale = "Matched target-Triton MTP3 fp8 arm; cache dtype is the sole executable difference from its paired arm."

[recipe.sources]
official = ["https://huggingface.co/bottlecapai/ThinkingCap-Qwen3.8-27B-NVFP4A4-AWQ/tree/f8fe157f207a13f977bc3d620ce10a3e9ba5ab11"]
community = []
local = ["docs/findings/2026-09-23-thinkingcap-evidence/feasibility-5090-input.json"]
