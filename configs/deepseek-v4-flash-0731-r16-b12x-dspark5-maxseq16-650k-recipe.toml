schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "verified"
source = "2026-08-02 locally qualified and human-approved Primary fallback after the 1M profile failed real Pi-shaped requests"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. Windows display output is on the AMD iGPU for this retry."

[recipe.serve]
engine = "vllm-r16-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:48518e91cf87dd0c0483c76ff86e81dfc0f46de7e364b46f7a82c481ce08188f"
entrypoint = ["/usr/local/bin/serve-ds4-flash.sh"]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-r16-jit:/cache",
  "deepseek-v4-0731-r16-tmp:/container-tmp",
]
quantization = "Official 0731 mixed FP8/FP4 checkpoint; B12X W4A8 NVFP4 MoE, B12X FP8 dense GEMM, FP8 KV"
context_tokens = 262144
port = 39062
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-tp2-650k"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39062",
  "MODE=dspark",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "DSPARK_DEPTH_MODE=fixed",
  "DSPARK_TOKENS=5",
  "DRAFT_SAMPLE_METHOD=probabilistic",
  "REJECTION_SAMPLE_METHOD=standard",
  "MAX_NUM_SEQS=16",
  "MAX_MODEL_LEN=262144",
  "MAX_NUM_BATCHED_TOKENS=8192",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "KV_OFFLOADING_SIZE=0",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SPEC_MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-tp2-650k",
]
flags = []
note = "2026-08-06 operator-directed retune: MAX_MODEL_LEN=262144 and MAX_NUM_BATCHED_TOKENS=8192 replace the 650000/4096 envelope. A same-day functional preflight (smoke, structured JSON, tool batch x20, tool-result continuation) passed at the new envelope with GPU KV cache 272,040 tokens (1.04x concurrency at 262,144/request). Prior long-context and performance evidence (local Pi protocol gate, 640K retrieval, matched 32K performance, Dark Pi, Mini Pi, and Mini OpenClaw client smokes) was recorded at 650000/4096 and does not transfer without fresh measurement. MAX_NUM_SEQS=16, model, image, TP2, DCP1, DSpark K5, WSL2 transport, 0.975 utilization, and zero CPU KV offload remain pinned. The router tier independently caps output at 32768 tokens and warns when it clamps a larger caller request. The separate 3 GiB reported-free VRAM gate is waived for this single-user exclusive deployment; measured headroom remains a caveat."

[recipe.fit]
suited = ["qualification", "speculative-decoding", "coding-agent"]
rationale = "Current single-user coding-agent Primary at the 2026-08-06 262144/8192 envelope. Long-context and concurrency fitness were demonstrated at the prior 650000/4096 envelope and await fresh measurement here."

