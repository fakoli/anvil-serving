schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "qualification-candidate"
source = "2026-08-02 near-limit qualification retained after removal from Primary for client-shaped B12X workspace failures"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only. Windows display output is on the AMD iGPU."

[recipe.serve]
engine = "vllm-r16-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:48518e91cf87dd0c0483c76ff86e81dfc0f46de7e364b46f7a82c481ce08188f"
entrypoint = ["/usr/local/bin/serve-ds4-flash.sh"]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-r16-jit:/cache",
  "deepseek-v4-0731-r16-tmp:/container-tmp",
]
quantization = "Official 0731 mixed FP8/FP4 checkpoint; B12X W4A8 NVFP4 MoE, B12X FP8 dense GEMM, FP8 KV"
context_tokens = 1000000
port = 39065
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-tp2-1m"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864:67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39065",
  "MODE=dspark",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "DSPARK_DEPTH_MODE=fixed",
  "DSPARK_TOKENS=5",
  "DRAFT_SAMPLE_METHOD=probabilistic",
  "REJECTION_SAMPLE_METHOD=standard",
  "MAX_NUM_SEQS=16",
  "MAX_MODEL_LEN=1000000",
  "MAX_NUM_BATCHED_TOKENS=2048",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "KV_OFFLOADING_SIZE=0",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SPEC_MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq16-tp2-1m",
]
flags = []
note = "Retained experimental profile. It passed the matched low-reasoning Pi gate, 32K c1 performance, near-985K retrieval, and a post-stress coding smoke, but later failed two real client-shaped requests with fatal B12X workspace errors: 703.64 MiB required versus 514.25 MiB available at a 32768-token output request, then 687.83 MiB versus 514.25 MiB for a 19118-token Pi prompt with max_tokens=5120. The second failure proves that an output cap alone does not protect this prompt/prefill shape. It is no longer llm.primary."

[recipe.fit]
suited = ["qualification", "speculative-decoding", "maximum-context", "single-user", "coding-agent", "agent-burst"]
rationale = "Experimental 1M capacity evidence only; do not expose to Pi or OpenClaw until the B12X client-shaped workspace failure is fixed and requalified."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731/tree/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
]
community = [
  "https://github.com/local-inference-lab/rtx6kpro/blob/master/models/ds4dspark-v20.md",
  "https://github.com/local-inference-lab/blackwell-llm-docker/tree/1dc0198b646d73a2fbb0dbafbb32875417150756",
]
local = [
  "configs/deepseek-v4-flash-0731-r16-b12x-dspark5-maxseq4-1m-recipe.toml",
  "docs/findings/2026-08-02-deepseek-r16-maxseq16-igpu-evidence/preflight-1m-maxseq4-needle985k-low.json",
  "docs/findings/2026-08-02-deepseek-r16-maxseq16-igpu-evidence/preflight-1m-maxseq4-pi-low.json",
]
