note = "Full v0.1.1-rc.14 candidate after the 131K first-boot and matched speculation controls. It carries the locally proven NCCL cuMem and PyTorch allocator controls plus the same hash-gated logits fallback and enable_thinking-aware runtime template; the upstream optional PCIe IPC allreduce remains off after its local boot failure. The 499712-token context and shared token pool, four running requests, twenty-eight recurrent-state slots, batch-size-one-through-four decode graphs, 4096-token prefill ceiling, serving-coverage warmup, torchvision media path, and native adaptive [3,5] MTP otherwise follow the pinned candidate. It left only 49 MiB/card after startup, emitted a late-loaded Triton-kernel OOM warning, and degraded at nominal 120K/C4 to 148.86 seconds median TTFT and 0.61 aggregate output tok/s. It is rejected on measured safety and performance, independent of the model-only reserve waiver."

