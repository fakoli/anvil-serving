schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "Inferact/Qwen3.8-27B-NVFP4"
status = "qualification-candidate"
source = "2026-08-15 matched SGLang TP1 393K MTP=3 arm derived from the qualified no-speculation control"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "Inferact/Qwen3.8-27B-NVFP4"
revision = "6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
vram_note = "One GPU in split mode; the other equal GPU remains independently assigned."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang@sha256:506525a5907ea22c9d445afb7c03603959b912de034d86915cf17da814f1a124"
entrypoint = ["python3", "-m", "sglang.launch_server"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--Inferact--Qwen3.8-27B-NVFP4/snapshots/6128240ebaf4eaa7bad2b3d1c72c37d677c5f462"
quantization = "ModelOpt NVFP4 W4A4 with FP8 projections and explicit FP8 E4M3 KV cache"
context_tokens = 393216
port = 39214
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-inferact-nvfp4-sglang-tp1-393k-mtp3"
ipc = "host"
shm_size = "32gb"
named_volumes = [
  "qwen38-nvfp4-sglang-cache:/root/.cache/sglang",
]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN=1",
]
flags = [
  "--served-model-name qwen38-27b-inferact-nvfp4-sglang-tp1-393k-mtp3",
  "--tp-size 1",
  "--language-only",
  "--context-length 393216",
  "--max-running-requests 1",
  "--mem-fraction-static 0.85",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-radix-cache",
  "--max-mamba-cache-size 5",
  "--speculative-algorithm EAGLE",
  "--speculative-num-steps 3",
  "--speculative-eagle-topk 1",
  "--speculative-num-draft-tokens 4",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--host 0.0.0.0",
  "--port 39214",
]
note = "One-variable MTP=3 extension of the qualified Inferact NVFP4 SGLang no-speculation control. Checkpoint, image digest, TP, 393K context, c1, FP8 KV, FlashInfer attention, 2K chunked prefill, cache policy, parsers, and thinking-disabled default remain fixed. The pinned image contains FlashInfer 0.6.18, newer than the cookbook's 0.6.15.post1 MTP compatibility floor. The in-checkpoint MTP head uses SGLang EAGLE 3/1/4. With radix cache disabled, the cookbook formula requires one request state plus four verification intermediates, so --max-mamba-cache-size changes from 1 to 5. The retained Inferact safety audit remains applicable because the exact snapshot is unchanged. Multimodal and promotion remain out of scope."

[recipe.fit]
suited = ["qualification", "long-context", "text", "coding", "agentic", "speculative-decoding"]
rationale = "Measures whether the NVFP4 control's baseline advantage compounds with in-checkpoint MTP without losing long-context or agentic correctness on one SM120 card."

[recipe.sources]
official = [
  "https://github.com/sgl-project/sglang/blob/dd458f3212dd4ddf0e1a7907bbf539b660e70d21/docs/cookbook/autoregressive/Qwen/Qwen3.8-27B.mdx",
  "https://github.com/sgl-project/sglang/blob/dd458f3212dd4ddf0e1a7907bbf539b660e70d21/docs/src/snippets/configs/Qwen/qwen3.8-27b.jsx",
]
community = [
  "https://huggingface.co/Inferact/Qwen3.8-27B-NVFP4/tree/6128240ebaf4eaa7bad2b3d1c72c37d677c5f462",
]
local = [
  "configs/qwen38-27b-inferact-nvfp4-sglang-tp1-393k-control-recipe.toml",
  "configs/qwen38-27b-official-fp8-sglang-tp1-393k-mtp3-recipe.toml",
  "docs/findings/2026-08-15-qwen38-27b-sglang-nvfp4-qualification.md",
]
