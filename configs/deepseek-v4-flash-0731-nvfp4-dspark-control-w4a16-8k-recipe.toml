schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
status = "qualification-candidate"
source = "2026-08-01 one-variable DSpark-off control for the pinned SM120 DSpark image"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
revision = "17e0f9da8257371654d458ba518659aa99954c86"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only."

[recipe.serve]
engine = "vllm"
allow_cuda_visible_devices_index = true
image = "anvil-vllm@sha256:76de0c41d9b216e17e81cfe89d9989c14e693c36eb76efaa860f8b27ef35d806"
quantization = "ModelOpt NVFP4 routed experts through Marlin W4A16; FP8/BF16 passthrough tensors"
context_tokens = 8192
port = 39061
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-nvfp4-tp2-dspark-control-w4a16-8k"
ipc = "host"
shm_size = "32gb"
ulimits = ["memlock=-1", "stack=67108864"]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "VLLM_USE_V2_MODEL_RUNNER=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
]
flags = [
  "--revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--tokenizer-revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--served-model-name deepseek-v4-flash-0731-nvfp4-tp2-dspark-control-w4a16-8k",
  "--trust-remote-code",
  "--tensor-parallel-size 2",
  "--kv-cache-dtype fp8",
  "--block-size 256",
  "--kernel-config '{\"moe_backend\":\"marlin\"}'",
  "--tokenizer-mode deepseek_v4",
  "--reasoning-parser deepseek_v4",
  "--enable-auto-tool-choice",
  "--tool-call-parser deepseek_v4",
  "--disable-custom-all-reduce",
  "--enforce-eager",
  "--max-num-batched-tokens 8192",
  "--max-model-len 8192",
  "--max-num-seqs 1",
  "--gpu-memory-utilization 0.94",
  "--host 0.0.0.0",
  "--port 39061",
]
note = "Matched DSpark control. Image, engine, checkpoint, TP, V2 runner, target quantization, block size, context, scheduling, kernel backend, memory utilization, and protocol parsers match the DSpark-5 lane. The only intended engine-level change is omission of --speculative-config, so no draft model is loaded."

[recipe.fit]
suited = ["qualification", "speculative-decoding-control"]
rationale = "Provides the required one-variable end-to-end control for deciding whether DSpark improves this exact SM120 TP2 deployment."

[recipe.sources]
official = [
  "https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-DSpark",
  "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash",
]
community = [
  "https://huggingface.co/auroter/DeepSeek-V4-Flash-0731-NVFP4/tree/17e0f9da8257371654d458ba518659aa99954c86",
]
local = [
  "configs/deepseek-v4-flash-0731-nvfp4-dspark5-w4a16-8k-recipe.toml",
]
