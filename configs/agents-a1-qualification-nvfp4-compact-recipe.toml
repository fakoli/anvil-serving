schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "protoLabsAI/Agents-A1-NVFP4"
status = "qualification-candidate-text-only-compact"
source = "Measured compact-allocation follow-up to the Agents-A1 qualification campaign"
family = "qwen3.5-moe-vl"
total_params_b = 35

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q"
arch = "sm_120"
vram_total_gb = 96

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai:nightly-f25953cc59f9b4ba9b04b16228d2b86dcfbcbdb1"
quantization = "compressed-tensors nvfp4"
context_tokens = 131072
port = 30010
served_model_name = "agents-a1-nvfp4-text-compact"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "VLLM_USE_FLASHINFER_SAMPLER=0",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
]
flags = [
  "--revision ff24ba5c35b99af25d7bf03c7997be5a0d2a5520",
  "--served-model-name agents-a1-nvfp4-text-compact",
  "--language-model-only",
  "--moe-backend marlin",
  "--kv-cache-dtype fp8",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--max-model-len 131072",
  "--max-num-seqs 16",
  "--gpu-memory-utilization 0.40",
  "--host 0.0.0.0",
  "--port 30010",
]

[recipe.fit]
suited = ["qualification", "text", "compact-allocation", "dual-instance-estimate"]
rationale = "Measured lower-allocation lane sized to retain c4 at 128K while testing whether two isolated text instances can fit on one 96 GB GPU."

[recipe.sources]
official = ["https://huggingface.co/protoLabsAI/Agents-A1-NVFP4"]
caveats = [
  "Text only; the publisher documents a vision-tower crash.",
  "MTP is excluded because the required Marlin path is incompatible.",
  "Dual-instance fit remains an estimate until both instances are started concurrently.",
]
