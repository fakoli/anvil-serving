schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
status = "qualification-candidate"
source = "2026-08-01 Auroter TP4 RTX PRO 6000 evidence translated to exclusive TP2"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
revision = "17e0f9da8257371654d458ba518659aa99954c86"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2/EP2 only. Pass both discovered GPU UUIDs through --gpu-device at load time."

[recipe.serve]
engine = "vllm"
allow_cuda_visible_devices_index = true
image = "vllm/vllm-openai@sha256:1161da8a5edbdff239ab1812784d7fe5d28775c675809a8420e8a0a05d0e56d1"
quantization = "ModelOpt NVFP4 routed experts through Marlin W4A16; FP8/BF16 passthrough tensors"
context_tokens = 32768
port = 39055
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-nvfp4-tp2-w4a16"
ipc = "host"
shm_size = "32gb"
ulimits = ["memlock=-1", "stack=67108864"]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "VLLM_USE_V2_MODEL_RUNNER=0",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
]
flags = [
  "--revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--tokenizer-revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--served-model-name deepseek-v4-flash-0731-nvfp4-tp2-w4a16",
  "--trust-remote-code",
  "--tensor-parallel-size 2",
  "--enable-expert-parallel",
  "--kv-cache-dtype fp8",
  "--kernel-config '{\"moe_backend\":\"marlin\"}'",
  "--tokenizer-mode deepseek_v4",
  "--reasoning-parser deepseek_v4",
  "--enable-auto-tool-choice",
  "--tool-call-parser deepseek_v4",
  "--disable-custom-all-reduce",
  "--enforce-eager",
  "--max-num-batched-tokens 8192",
  "--max-model-len 32768",
  "--max-num-seqs 1",
  "--gpu-memory-utilization 0.94",
  "--host 0.0.0.0",
  "--port 39055",
]
note = "First translated SM120 baseline. The source evidence used TP4/EP4 on four RTX PRO 6000 cards; this profile changes only the parallel shape and bounded capacity needed for two cards. Marlin W4A16 and DSpark-off preserve the strongest reported quality parity. Eager mode and c1 reduce first-fit memory risk. Leave DeepGEMM enabled; the Auroter card reports that disabling it misroutes UE8M0 scales."

[recipe.fit]
suited = ["qualification", "openclaw", "pi-coding", "agentic", "coding", "reasoning", "tool-use"]
rationale = "Tests the strongest same-GPU-family 0731 NVFP4 prior while preserving the publisher SGLang profile as the quality and protocol control."

[recipe.sources]
official = [
  "https://github.com/vllm-project/vllm/tree/568afb3a13806beb53bb2e6bd518269357b237c0",
  "https://hub.docker.com/r/vllm/vllm-openai/tags?name=v0.26.0-ubuntu2404",
]
community = [
  "https://huggingface.co/auroter/DeepSeek-V4-Flash-0731-NVFP4/tree/17e0f9da8257371654d458ba518659aa99954c86",
]
local = [
  "docs/findings/2026-08-01-deepseek-v4-flash-0731-research-update.md",
  "docs/findings/2026-08-01-dual-pro-tp2-model-campaign.md",
]
