schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
status = "qualification-candidate"
source = "2026-08-01 controlled DSpark-5 TP2 functional fit lane after the protected 128K profile failed KV initialization"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
revision = "17e0f9da8257371654d458ba518659aa99954c86"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2 only."

[recipe.serve]
engine = "vllm"
allow_cuda_visible_devices_index = true
image = "anvil-vllm@sha256:76de0c41d9b216e17e81cfe89d9989c14e693c36eb76efaa860f8b27ef35d806"
quantization = "ModelOpt NVFP4 target routed experts plus MXFP4 DSpark draft experts; Marlin W4A16 target path; FP8/BF16 passthrough tensors"
context_tokens = 8192
port = 39060
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-nvfp4-tp2-dspark5-w4a16-8k"
ipc = "host"
shm_size = "32gb"
ulimits = ["memlock=-1", "stack=67108864"]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "VLLM_USE_V2_MODEL_RUNNER=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_P2P_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
]
flags = [
  "--revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--tokenizer-revision 17e0f9da8257371654d458ba518659aa99954c86",
  "--served-model-name deepseek-v4-flash-0731-nvfp4-tp2-dspark5-w4a16-8k",
  "--trust-remote-code",
  "--tensor-parallel-size 2",
  "--kv-cache-dtype fp8",
  "--block-size 256",
  "--kernel-config '{\"moe_backend\":\"marlin\"}'",
  "--tokenizer-mode deepseek_v4",
  "--reasoning-parser deepseek_v4",
  "--enable-auto-tool-choice",
  "--tool-call-parser deepseek_v4",
  "--speculative-config '{\"method\":\"dspark\",\"num_speculative_tokens\":5,\"draft_sample_method\":\"probabilistic\"}'",
  "--disable-custom-all-reduce",
  "--enforce-eager",
  "--max-num-batched-tokens 8192",
  "--max-model-len 8192",
  "--max-num-seqs 1",
  "--gpu-memory-utilization 0.94",
  "--host 0.0.0.0",
  "--port 39060",
]
note = "Functional fit lane only, not a long-context recommendation. It changes only max_model_len from the failed 128K DSpark profile and makes the backend-preferred 256-token KV block explicit. Expert parallel remains off because target experts are NVFP4 while draft experts remain MXFP4. Engine 52113932444ed3b8f2228b2589ef2ff3cedf7ab2; vLLM 20260803.dev4+g521139324.d20260801; immutable image digest sha256:76de0c41d9b216e17e81cfe89d9989c14e693c36eb76efaa860f8b27ef35d806."

[recipe.fit]
suited = ["qualification", "functional-smoke", "speculative-decoding"]
rationale = "Proves DSpark correctness, nonzero acceptance, and protocol compatibility at the engine-estimated protected-memory fit point before any long-context memory change."

