schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "Qwen/Qwen3.8-27B-FP8"
status = "qualification-candidate"
source = "2026-08-14 matched Qwen3.8 FP8 TP2 1M no-MTP qualification arm"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "Qwen/Qwen3.8-27B-FP8"
revision = "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Two equal PCIe-attached GPUs without NVLink; exclusive TP=2, with sharded rather than unified capacity."

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai@sha256:4a2f33a884222f7049b983263ad9976f89452bb81affecf5b67d89ad35c1bc31"
model_path = "/root/.cache/huggingface/hub/models--Qwen--Qwen3.8-27B-FP8/snapshots/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
quantization = "official block-scaled FP8 weights with FP8 KV cache"
context_tokens = 1010000
port = 39124
startup_timeout_seconds = 1800
served_model_name = "qwen38-27b-fp8-tp2-1m-control"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
]
flags = [
  "--revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a",
  "--served-model-name qwen38-27b-fp8-tp2-1m-control",
  "--tensor-parallel-size 2",
  "--language-model-only",
  "--kv-cache-dtype fp8",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--enable-chunked-prefill",
  "--no-enable-prefix-caching",
  "--max-model-len 1010000",
  "--hf-overrides '{\"text_config\":{\"max_position_embeddings\":1010000}}'",
  "--max-num-seqs 1",
  "--max-num-batched-tokens 4096",
  "--gpu-memory-utilization 0.92",
  "--host 0.0.0.0",
  "--port 39124",
]
note = "Matched no-MTP control for the TP2 1M campaign point. Max sequences, batching, cache policy, precision, runtime, and context are held fixed against configs/qwen38-27b-fp8-tp2-1m-mtp3-recipe.toml. Router and promotion state remain out of scope."

[recipe.fit]
suited = ["qualification","long-context","text","coding","agentic"]
rationale = "Measures topology, context, and MTP effects on the pinned official checkpoint without changing a routed alias."

[recipe.sources]
official = [
  "https://github.com/vllm-project/recipes/blob/002576894984c12e203bb25421635fbb3f408e9d/models/Qwen/Qwen3.8-27B.yaml",
  "https://huggingface.co/Qwen/Qwen3.8-27B-FP8/tree/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a",
  "https://github.com/vllm-project/vllm/tree/3a0914114705fa38d4c3171d0746c1a6b6f10209",
]
local = [
  "configs/qwen38-27b-fp8-tp2-1m-mtp3-recipe.toml",
  "docs/findings/2026-08-14-qwen38-27b-tp-mtp-context-matrix.md",
]
