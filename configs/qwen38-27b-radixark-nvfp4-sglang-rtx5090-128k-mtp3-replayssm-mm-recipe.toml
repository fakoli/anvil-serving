schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "RadixArk/Qwen3.8-27B-NVFP4-RTX5090-128K-MTP3-ReplaySSM"
status = "rejected"
source = "2026-08-21 RTX 5090 same-checkpoint MTP3 plus ReplaySSM qualification and 128K-capacity rejection"
family = "qwen3.8-dense-vl"
total_params_b = 27

[recipe.download]
repo = "RadixArk/Qwen3.8-27B-NVFP4"
revision = "554ebba9b5f1b79dc11246341960360e6ef05ef4"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "NVIDIA GeForce RTX 5090"
arch = "sm_120"
vram_total_gb = 32
vram_note = "Single-GPU qualification host; the hard gate requires the retained 128K contract and post-start runtime headroom."

[recipe.serve]
engine = "sglang"
image = "lmsysorg/sglang:dev@sha256:8acc563e39f4e79118cc3c11cb5a8893ca8da140b2280cdd24a9f3bfe38835a0"
entrypoint = ["sglang", "serve"]
model_flag = "--model-path"
model_path = "/root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-27B-NVFP4/snapshots/554ebba9b5f1b79dc11246341960360e6ef05ef4"
quantization = "ModelOpt NVFP4 W4A4 with FP8 projections, BF16 vision/MTP tensors, and FP8 E4M3 KV cache"
context_tokens = 131072
port = 39038
startup_timeout_seconds = 2400
served_model_name = "qwen38-27b-radixark-nvfp4-sglang-rtx5090-128k-mm"
ipc = "host"
shm_size = "16gb"
named_volumes = [
  "qwen38-radixark-nvfp4-sglang-cache:/root/.cache/sglang",
]
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "SGLANG_USE_CUDA_IPC_TRANSPORT=0",
  "SGLANG_VIT_ENABLE_CUDA_GRAPH=0",
  "SGLANG_MM_BUFFER_SIZE_MB=0",
]
flags = [
  "--served-model-name qwen38-27b-radixark-nvfp4-sglang-rtx5090-128k-mm",
  "--trust-remote-code",
  "--tp-size 1",
  "--mm-feature-transport cpu",
  "--limit-mm-data-per-request '{\"image\":8,\"video\":2}'",
  "--context-length 131072",
  "--max-running-requests 1",
  "--cuda-graph-max-bs 1",
  "--mem-fraction-static 0.945",
  "--kv-cache-dtype fp8_e4m3",
  "--attention-backend flashinfer",
  "--chunked-prefill-size 2048",
  "--disable-prefill-cuda-graph",
  "--disable-radix-cache",
  "--max-mamba-cache-size 1",
  "--mamba-ssm-dtype float32",
  "--speculative-algorithm EAGLE",
  "--speculative-num-steps 3",
  "--speculative-eagle-topk 1",
  "--speculative-num-draft-tokens 4",
  "--enable-linear-replayssm-spec",
  "--reasoning-parser qwen3",
  "--tool-call-parser qwen3_coder",
  "--default-chat-template-kwargs '{\"enable_thinking\":false}'",
  "--host 0.0.0.0",
  "--port 39038",
]
note = "Rejected as a replacement for the retained 128K service. This same-checkpoint candidate used the native MTP head at the established 3/1/4 shape, with ReplaySSM replacing per-draft recurrent-state snapshots. It passed coding, JSON, a 49,549-token retrieval prompt, tools 20/20, streaming tools, tool-result continuation, and the Responses subset. Against the matched no-speculation baseline, median decode improved from 76.54 to 138.19 tok/s at 4K and from 69.75 to 117.10 tok/s at 64K. The separately loaded 5.73 GB MTP draft nevertheless left only 70,231 target and draft KV tokens, so the candidate could not satisfy the 128K contract; 64K end-to-end median also regressed 1.9 percent because prefill dominated. The exact baseline was restored and re-passed the 105,649-token retrieval plus tools 20/20. No route or promotion changed."

[recipe.fit]
suited = ["qualification", "long-context", "single-stream", "multimodal", "tool-use", "speculative-decoding"]
rationale = "Retained as a reproducible negative result: ReplaySSM removes the large recurrent-state multiplier, but the separately loaded in-checkpoint MTP draft still prevents the full 128K operating point on 32 GB."

[recipe.sources]
official = [
  "https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8-27B",
  "https://github.com/sgl-project/sglang/pull/28695",
  "https://www.lmsys.org/blog/2026-08-12-qwen3-8-day0-support",
]
community = [
  "https://huggingface.co/RadixArk/Qwen3.8-27B-NVFP4/tree/554ebba9b5f1b79dc11246341960360e6ef05ef4",
  "https://huggingface.co/calneymgp/Qwen3.8-27B-NVFP4-lmhead4-recipe",
]
local = [
  "configs/qwen38-27b-radixark-nvfp4-sglang-rtx5090-128k-mm-recipe.toml",
  "docs/findings/2026-08-21-qwen38-27b-radixark-nvfp4-dflash2-rtx5090.md",
]
