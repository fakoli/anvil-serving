schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "InternScience/Agents-A1"
status = "qualification-candidate"
source = "Agents-A1 multimodal qualification campaign; text-only control"
family = "qwen3.5-moe-vl"
total_params_b = 35

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q"
arch = "sm_120"
vram_total_gb = 96

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai:nightly-f25953cc59f9b4ba9b04b16228d2b86dcfbcbdb1"
quantization = "bf16"
context_tokens = 131072
port = 30010
served_model_name = "agents-a1-bf16-text"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
]
flags = [
  "--revision addff08f1653ee72765c5cf458fe84556bb34f8e",
  "--served-model-name agents-a1-bf16-text",
  "--language-model-only",
  "--kv-cache-dtype fp8",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--max-model-len 131072",
  "--max-num-seqs 16",
  "--gpu-memory-utilization 0.92",
  "--host 0.0.0.0",
  "--port 30010",
]

[recipe.fit]
suited = ["qualification", "text-control", "agentic", "long-context"]
rationale = "BF16 quality ceiling with the vision encoder intentionally omitted."

[recipe.sources]
official = ["https://huggingface.co/InternScience/Agents-A1"]
local = ["docs/findings/2026-07-27-anvil-serving-release-readiness-sweep.md"]

