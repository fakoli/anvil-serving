volume = "vllm-hfcache"
require_complete_cache = false

[recipe.hardware]
gpu = "NVIDIA GeForce RTX 5090"
arch = "sm_120"
vram_total_gb = 32
vram_note = "Q6_K plus Q4_0 KV at 64K passed the campaign interval screen with the normal 3 GiB reserve; measured residency remains a hard gate."

[recipe.serve]
engine = "llamacpp"
image = "ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:cf2e30bc855cf58cdbdc65d05b5b5e02afa95fb788343a5334d704367ac5c9ac"
entrypoint = ["/app/llama-server"]
model_flag = "-m"
model_path = "/root/.cache/huggingface/hub/models--agentionai--Signal-3.8-27B-GGUF/snapshots/9848da210febc2141edb7e3f89cfc307a0d15163/AP-Q6_K/Signal-3.8-27B-AP-Q6_K.gguf"
quantization = "publisher iMatrix AP-Q6_K target, Q4_0 K/V cache, no speculation (matched MTP3 control)"
context_tokens = 65536
port = 8081
health = "/health"
startup_timeout_seconds = 1800
served_model_name = "signal38-27b-q6k-nospec-64k"
env = ["CUDA_DEVICE_ORDER=PCI_BUS_ID", "PYTHONHASHSEED=0", "GGML_CUDA_GRAPH_OPT=1"]
flags = [
  "--alias signal38-27b-q6k-nospec-64k", "--fit off", "--ctx-size 65536",
  "--parallel 1", "--ctx-checkpoints 4", "--batch-size 512", "--ubatch-size 256",
  "--threads 8", "--threads-batch 8", "--n-gpu-layers 999", "--flash-attn on",
  "--cache-type-k q4_0", "--cache-type-v q4_0",
  "--jinja", "--reasoning off", "--temp 0.7", "--top-p 0.95", "--top-k 20",
  "--min-p 0", "--metrics", "--host 0.0.0.0", "--port 8081",
]
note = "Signal is a same-family fine-tune explicitly targeting shorter answers and fewer thinking tokens. Publisher measurements are advisory; this recipe measures the exact Q6_K artifact locally."

[recipe.fit]
suited = ["single-gpu", "64k-context", "efficient-reasoning", "interactive-tools", "coding", "speculative-decoding"]
not_suited = ["automatic-promotion", "full-native-context-without-capacity-proof", "qualified-vision"]
rationale = "Tests whether a minimally invasive terse fine-tune improves useful wall time while retaining strict tool and coding behavior."

[recipe.sources]
