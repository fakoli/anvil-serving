schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "deepseek-ai/DeepSeek-V4-Flash-0731"
status = "verified"
source = "Current community-recipe external prior published 2026-08-15 and observed 2026-08-16: locally qualified and human-promoted translation of local-inference-lab's Infernal Invocation r15 recipe, authored by Martin Vit (voipmonitor); upstream qualified 131072 tokens, while the independent local profile qualifies a 393216-token envelope"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "deepseek-ai/DeepSeek-V4-Flash-0731"
revision = "9e165c30e2704aec5d9d593cce3eebd58bbef1cb"
volume = "deepseek-v4-0731-r16-hfcache"
require_complete_cache = true

[recipe.hardware]
gpu = "2x NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink under WSL2; exclusive TP2 only. Upstream r15 measurements used native Linux GPUs on direct PCIe root ports and do not qualify this topology."

[recipe.serve]
engine = "vllm-infernal-invocation-r15-b12x"
allow_cuda_visible_devices_index = true
image = "voipmonitor/vllm@sha256:f1b13c8604b274212e1164def7d4ed7a4cac9e4f7fa06fa1739730195eca4e18"
entrypoint = [
  "/usr/local/bin/lmcache-mp-wrapper.sh",
  "/usr/local/bin/serve-ds4-flash.sh",
]
model_env = "MODEL"
named_volumes = [
  "deepseek-v4-0731-infernal-r15-jit:/cache",
  "deepseek-v4-0731-infernal-r15-tmp:/container-tmp",
]
quantization = "Released 0731 checkpoint through B12X W4A8 kernels; NVFP4 MoE weights, FP8 activations/dense path, and FP8 compressed MLA KV"
context_tokens = 393216
port = 39077
startup_timeout_seconds = 2400
served_model_name = "deepseek-v4-flash-0731-infernal-r15-b12x-dspark5-maxseq8-batch4096-tp2-393k"
ipc = "host"
shm_size = "32gb"
ulimits = [
  "memlock=-1",
  "nofile=1048576:1048576",
  "stack=67108864",
]
env = [
  "CUDA_VISIBLE_DEVICES=0,1",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "PYTHONHASHSEED=0",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "NCCL_IB_DISABLE=1",
  "NCCL_CUMEM_ENABLE=0",
  "NCCL_CUMEM_HOST_ENABLE=0",
  "NCCL_DEBUG=INFO",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
  "PORT=39077",
  "MODE=dspark",
  "BACKEND=b12x-a8",
  "TP_SIZE=2",
  "DCP_SIZE=1",
  "ALLREDUCE_MODE=auto",
  "B12X_PCIE_TP2_REMOTE_PUSH=0",
  "DSPARK_DEPTH_MODE=fixed",
  "DSPARK_TOKENS=5",
  "DSPARK_CAPACITY_ACTIVATION_BATCH_SIZE=0",
  "DRAFT_SAMPLE_METHOD=probabilistic",
  "REJECTION_SAMPLE_METHOD=standard",
  "VLLM_MOE_SKIP_PADDING=1",
  "GRAPH=auto",
  "MAX_NUM_SEQS=8",
  "MAX_MODEL_LEN=393216",
  "MAX_NUM_BATCHED_TOKENS=4096",
  "GPU_MEMORY_UTILIZATION=0.975",
  "LMCACHE_MODE=off",
  "KV_OFFLOADING_SIZE=0",
  "NATIVE_L2_GB=0",
  "LOAD_FORMAT=instanttensor",
  "INSTANTTENSOR_BACKEND=BUFFERED",
  "MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SPEC_MODEL_PATH=/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-0731/snapshots/9e165c30e2704aec5d9d593cce3eebd58bbef1cb",
  "SERVED_MODEL_NAME=deepseek-v4-flash-0731-infernal-r15-b12x-dspark5-maxseq8-batch4096-tp2-393k",
]
flags = []
note = "Locally qualified and human-promoted on 2026-08-16. The local-inference-lab r15 receipt qualified TP2/DCP1, max-seq-8, batch-4096, fixed probabilistic DSpark K5, native offload disabled, and LMCache disabled at 131072 tokens on two direct-root-port RTX PRO 6000 GPUs. This WSL2 translation retains that shape, raises MAX_MODEL_LEN to 393216, and adds the established local NCCL controls. Direct retrieval passed at 351118 actual prompt tokens; the authenticated router passed a separate 340119-token retrieval. Matched 4K K5/no-spec decode was 150.0/76.4 tok/s and the repeated intelligence/session/tool suite passed 12/12. The managed promotion installed this profile as llm.primary with r33 as the fixed-port rollback. Credit: Martin Vit (voipmonitor); local-inference-lab/rtx6kpro and local-inference-lab/blackwell-llm-docker; B12X PR 214 and vLLM PR 320 contributors. The pinned upstream repositories expose no root license file; this recipe references and translates their public configuration but does not redistribute the image or source."

[recipe.fit]
suited = ["serving-primary", "qualification", "long-context", "speculative-decoding", "coding-agent"]
rationale = "Qualified text Primary at 393216 tokens. It preserves the upstream max-seq-8, batch-4096, TP2/DCP1, FP8-KV, no-offload, and fixed K5 controls while adding independently measured WSL2 correctness, capacity, performance, quality, routed acceptance, and fixed-port rollback evidence."

