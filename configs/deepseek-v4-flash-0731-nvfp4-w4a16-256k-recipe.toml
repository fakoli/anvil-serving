schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
status = "qualification-candidate"
source = "2026-08-01 controlled 256K expansion of the qualified TP2 W4A16 baseline"
family = "deepseek-v4"
total_params_b = 304
active_params_b = 13

[recipe.download]
repo = "auroter/DeepSeek-V4-Flash-0731-NVFP4"
revision = "17e0f9da8257371654d458ba518659aa99954c86"
volume = "vllm-hfcache"
require_complete_cache = true

[recipe.hardware]
