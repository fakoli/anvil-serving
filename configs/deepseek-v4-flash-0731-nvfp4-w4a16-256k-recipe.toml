arch = "sm_120"
vram_total_gb = 192
vram_note = "Aggregate PCIe VRAM without NVLink; exclusive TP2/EP2 only."

[recipe.serve]
engine = "vllm"
allow_cuda_visible_devices_index = true
image = "vllm/vllm-openai@sha256:1161da8a5edbdff239ab1812784d7fe5d28775c675809a8420e8a0a05d0e56d1"
quantization = "ModelOpt NVFP4 routed experts through Marlin W4A16; FP8/BF16 passthrough tensors"
context_tokens = 262144
port = 39058
startup_timeout_seconds = 1800
served_model_name = "deepseek-v4-flash-0731-nvfp4-tp2-w4a16-256k"
ipc = "host"
shm_size = "32gb"
ulimits = ["memlock=-1", "stack=67108864"]
env = ["CUDA_VISIBLE_DEVICES=0,1", "CUDA_DEVICE_ORDER=PCI_BUS_ID", "VLLM_WSL2_ENABLE_PIN_MEMORY=1", "VLLM_USE_V2_MODEL_RUNNER=0", "NCCL_IB_DISABLE=1", "NCCL_P2P_DISABLE=1", "NCCL_CUMEM_ENABLE=0", "NCCL_CUMEM_HOST_ENABLE=0", "NCCL_DEBUG=INFO"]
flags = ["--revision 17e0f9da8257371654d458ba518659aa99954c86", "--tokenizer-revision 17e0f9da8257371654d458ba518659aa99954c86", "--served-model-name deepseek-v4-flash-0731-nvfp4-tp2-w4a16-256k", "--trust-remote-code", "--tensor-parallel-size 2", "--enable-expert-parallel", "--kv-cache-dtype fp8", "--kernel-config '{\"moe_backend\":\"marlin\"}'", "--tokenizer-mode deepseek_v4", "--reasoning-parser deepseek_v4", "--enable-auto-tool-choice", "--tool-call-parser deepseek_v4", "--disable-custom-all-reduce", "--enforce-eager", "--max-num-batched-tokens 8192", "--max-model-len 262144", "--max-num-seqs 1", "--gpu-memory-utilization 0.94", "--host 0.0.0.0", "--port 39058"]
note = "Controlled context expansion; differs from the 32K W4A16 baseline only in max-model-len, served identity, and port."

[recipe.fit]
suited = ["qualification", "openclaw", "pi-coding", "agentic", "coding", "long-context"]
rationale = "Measures the target 256K coding-agent context lane without changing weight, kernel, or parallel settings."

[recipe.sources]
