schema = "anvil-serving.serve-recipes/v1"

[[recipe]]
model = "InternScience/Agents-A1-FP8"
status = "qualification-candidate"
source = "2026-07-29 same-context head-to-head; official FP8 multimodal profile at 262,144 tokens"
family = "qwen3.5-moe-vl"
total_params_b = 35

[recipe.download]
repo = "InternScience/Agents-A1-FP8"
revision = "4d7d59380f327b76e73bc71f40e0c589ad0ca1d5"
volume = "vllm-hfcache"

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
gpu_uuid = "GPU-11111111-1111-1111-1111-111111111111"

[recipe.serve]
engine = "vllm"
image = "vllm/vllm-openai:nightly-f25953cc59f9b4ba9b04b16228d2b86dcfbcbdb1"
quantization = "compressed-tensors fp8"
context_tokens = 262144
port = 30010
served_model_name = "agents-a1-fp8-mm-262k"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
]
flags = [
  "--revision 4d7d59380f327b76e73bc71f40e0c589ad0ca1d5",
  "--served-model-name agents-a1-fp8-mm-262k",
  "--kv-cache-dtype fp8",
  "--reasoning-parser qwen3",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--limit-mm-per-prompt '{\"image\":4,\"video\":1}'",
  "--media-io-kwargs '{\"video\":{\"num_frames\":-1}}'",
  "--max-model-len 262144",
  "--max-num-seqs 1",
  "--gpu-memory-utilization 0.94",
  "--host 0.0.0.0",
  "--port 30010",
]

[recipe.fit]
suited = ["qualification", "long-context", "text", "image", "video", "mixed-media"]
rationale = "Same-context official FP8 lane for a direct c1 head-to-head with the current Qwen Primary checkpoint."

[recipe.sources]
official = [
  "https://huggingface.co/InternScience/Agents-A1-FP8",
  "https://docs.vllm.ai/en/stable/features/multimodal_inputs/",
]
community = ["https://huggingface.co/InternScience/Agents-A1/discussions/18"]

[[recipe]]
model = "nvidia/Qwen3.5-122B-A10B-NVFP4"
status = "qualification-candidate"
source = "2026-07-29 same-context head-to-head; current Primary checkpoint with bounded video enabled"
family = "qwen3.5-moe-vl"
total_params_b = 122
active_params_b = 10

[recipe.download]
repo = "nvidia/Qwen3.5-122B-A10B-NVFP4"
revision = "98915d837c4e7c87ac8296d02e89de19b3207e6d"
volume = "vllm-hfcache"

[recipe.hardware]
gpu = "NVIDIA RTX PRO 6000 Blackwell Max-Q Workstation Edition"
arch = "sm_120"
vram_total_gb = 96
gpu_uuid = "GPU-11111111-1111-1111-1111-111111111111"

[recipe.serve]
engine = "vllm"
image = "nvcr.io/nvidia/vllm:26.06-py3"
entrypoint = ["python3", "-m", "vllm.entrypoints.openai.api_server"]
model_flag = "--model"
allow_cuda_visible_devices_index = true
quantization = "modelopt_fp4"
context_tokens = 262144
port = 30010
served_model_name = "qwen35-122b-a10b-nvfp4-video-262k"
ipc = "host"
shm_size = "32gb"
env = [
  "CUDA_VISIBLE_DEVICES=1",
  "VLLM_USE_V2_MODEL_RUNNER=0",
  "FLASHINFER_CUDA_ARCH_LIST=12.0f",
  "CUDA_DEVICE_ORDER=PCI_BUS_ID",
]
flags = [
  "--revision 98915d837c4e7c87ac8296d02e89de19b3207e6d",
  "--tokenizer-revision 98915d837c4e7c87ac8296d02e89de19b3207e6d",
  "--served-model-name qwen35-122b-a10b-nvfp4-video-262k",
  "--trust-remote-code",
  "--quantization modelopt_fp4",
  "--kv-cache-dtype bfloat16",
  "--tensor-parallel-size 1",
  "--enable-auto-tool-choice",
  "--tool-call-parser qwen3_coder",
  "--reasoning-parser qwen3",
  "--limit-mm-per-prompt '{\"image\":4,\"video\":1}'",
  "--media-io-kwargs '{\"video\":{\"num_frames\":-1}}'",
  "--enable-prefix-caching",
  "--enable-chunked-prefill",
  "--max-num-batched-tokens 8192",
  "--gpu-memory-utilization 0.94",
  "--max-num-seqs 1",
  "--max-model-len 262144",
  "--host 0.0.0.0",
  "--port 30010",
]

[recipe.fit]
suited = ["qualification", "long-context", "text", "image", "video", "mixed-media"]
rationale = "Current Primary checkpoint with video enabled only for the isolated same-context direct benchmark."

[recipe.sources]
official = [
  "https://huggingface.co/Qwen/Qwen3.5-122B-A10B",
  "https://huggingface.co/nvidia/Qwen3.5-122B-A10B-NVFP4",
]
