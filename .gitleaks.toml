title = "anvil-serving secret scan"

[extend]
useDefault = true

# Exact non-secret pair labels, each checked against both frozen arm cell IDs.
[[allowlists]]
description = "GLM comparison matrix pair identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)docs/findings/2026-10-17-glm53-serving-performance-evidence/plans/prompt-reconstruction-review\.json$''']
regexes = [
  '''^\s*"pair_key": "capacity-edge-ctx310272-c1",?$''',
  '''^\s*"pair_key": "capacity-edge-ctx310272-c2",?$''',
  '''^\s*"pair_key": "capacity-edge-ctx310272-c4",?$''',
  '''^\s*"pair_key": "natural-ctx10240-c1",?$''',
  '''^\s*"pair_key": "natural-ctx10240-c2",?$''',
  '''^\s*"pair_key": "natural-ctx10240-c4",?$''',
  '''^\s*"pair_key": "natural-ctx40960-c1",?$''',
  '''^\s*"pair_key": "natural-ctx40960-c2",?$''',
  '''^\s*"pair_key": "natural-ctx40960-c4",?$''',
  '''^\s*"pair_key": "natural-ctx163840-c1",?$''',
  '''^\s*"pair_key": "natural-ctx163840-c2",?$''',
  '''^\s*"pair_key": "natural-ctx163840-c4",?$''',
  '''^\s*"pair_key": "warmup-ctx10240-c1",?$''',
  '''^\s*"pair_key": "warmup-ctx163840-c1",?$''',
  '''^\s*"pair_key": "warmup-edge-ctx310272-c1",?$''',
]

# Exact hashes in the frozen Apple voice evidence. Scope each exception to
# its provenance field, value and source path; adjacent credentials still fail.
[[allowlists]]
description = "Pinned MLX-LM tokenizer source fingerprint in cache diagnostics"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docs/findings/2026-10-06-m4-max-voice-quality-qualification-evidence/projections/mlx_lm_runtime_cache0_v[12]_identity\.json$''']
regexes = ['''tokenizer_utils\.py[^\r\n]{0,8}ecb52655e86ff6d6db6a657601ece11f195e85971482eb2d0f40c20de17eb4c5["']?''']

[[allowlists]]
description = "Frozen blind-listening schedule file fingerprint"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docs/findings/2026-10-06-m4-max-voice-quality-qualification-evidence/projections/tts-listening-schedule-amendment-01\.json$''']
regexes = ['''original_reveal_key_sha256[^\r\n]{0,8}3cd47d23e898c5efddfc2e20ab82092fc74a1458e18a318a151e705132a4ae11["']?''']

# Public/synthetic values used to prove redaction and validation behavior.
# Keep these value-specific: never allowlist an entire test directory.
[[allowlists]]
description = "Documented and synthetic AWS access-key examples"
targetRules = ["aws-access-token"]
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''AKIAABCDEFGHIJKLMNOP''',
]

[[allowlists]]
description = "Deterministic long-context retrieval sentinel"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)anvil_serving/preflight\.py$''']
regexes = ['''ZEBRA-42917-QUARTZ''']

[[allowlists]]
description = "Immutable tokenizer revisions are provenance, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docs/findings/.*\.(json|log)$''']
regexes = [
  '''(?i)tokenizer_revision[^\r\n]{0,32}["']?[0-9a-f]{40,64}["']?''',
]

[[allowlists]]
description = "Published model-capacity setting"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)docs/findings/2026-08-02-deepseek-v4-flash-0731-primary-promotion\.md$''']
regexes = ['''MAX_NUM_SEQS=16''']

[[allowlists]]
description = "Exact pinned MiMo tokenizer fingerprint in diagnostic captures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)docs/findings/artifacts/2026-10-06-mimo-qualification/mimo-r1-raw-(parallel-greedy|structured-thinking-off)-capture\.json$''']
regexes = ['''tokenizer_sha256[^\r\n]{0,8}ff15eb925890d6b71b5160de4b846fbd13178438ab463b38ecc953e8cd1dcb3e["']?''']

[[allowlists]]
description = "RFC 6455 sample WebSocket nonce"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)tests/voice/test_ws_transport\.py$''']
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']

[[allowlists]]
description = "Deterministic render digests of the synthetic Connect fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)tests/connect/test_render\.py$''']
regexes = [
  '''797df756cc7391a94bf230a3a5e8ba84545c5bc7a8a31e099218f5834f15a672''',
  '''5209fa0cdd415eae7300f507591894251e3ce131438701a65534fdfef032e333''',
  '''213a3fd28ca1ce71e1288ddb249021763a4a08149b05b6eea2ec447d6dfbdacb''',
]

