# Generic on-demand media-worker manifest.
#
# Copy this template into the private operator home and add the real GPU role,
# target host, co-resident reservations, and storage assignments there. The
# public manifest intentionally names no operator machine or reachable address.
# Keep vram_mib synchronized with COMFYUI_EXTRA_ARGS in docker-compose.comfyui.yml.

[[gpu_roles]]
id = "media-compute"
vram_mib = 32768
reserve_mib = 4096

[[serve]]
name = "comfyui"
stack = "comfyui"
container = "anvil-comfyui"
runtime = "docker"
port = 8188
model = "comfyui-v0.33.4"
engine = "image"
health = "/system_stats"
gpu_role = "media-compute"
vram_mib = 28672
residency = "on-demand"
groups = ["media", "comfy"]
up = "docker compose --project-name anvil-comfyui -f {dir}/docker-compose.comfyui.yml up -d --build comfyui"
