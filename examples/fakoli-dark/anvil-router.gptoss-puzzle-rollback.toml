# Complete router rollback paired with the managed
# `heavy-gptoss-puzzle-rollback` serve. Unaffected tiers and purpose models
# intentionally match anvil-router.live.toml.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
mapping_version = "2026-07-26.fakoli-dark-gptoss-puzzle-heavy-rollback"
verify_local_min = true
availability_probe_interval = 5
availability_probe_timeout = 1
profile_path = "/etc/anvil/profile.json"
audio_max_input_bytes = 8388608
audio_max_output_bytes = 8388608
audio_max_text_chars = 16384
audio_max_concurrency = 2

[[router.tiers]]
id            = "fast-local"
base_url      = "http://host.docker.internal:30003/v1"
model         = "gemma4-e4b-it"
quantization  = "fp8"
dialect       = "openai"
context_limit = 32768
privacy       = "local"
tool_support  = true
auth_env      = "ANVIL_FAST_LOCAL_KEY"
health_path   = "/health"
extra_body    = { chat_template_kwargs = { enable_thinking = false } }

[router.tiers.params]
generation_probe_max_tokens = 48
interaction_benchmark_max_tokens = 192
interaction_benchmark_stream_max_tokens = 128

[[router.tiers]]
id            = "heavy-local"
base_url      = "http://host.docker.internal:30002/v1"
model         = "gpt-oss-puzzle-88b"
dialect       = "openai"
context_limit = 131072
privacy       = "local"
tool_support  = true
auth_env      = "ANVIL_HEAVY_LOCAL_KEY"
health_path   = "/health"
model_identity = true
extra_body_defaults = { reasoning_effort = "high" }

[router.tiers.params]
generation_probe_max_tokens = 4352
interaction_benchmark_max_tokens = 4352
interaction_benchmark_stream_max_tokens = 4352
interaction_benchmark_max_tokens_by_intent = { planning = 4352 }
interaction_benchmark_stream_max_tokens_by_intent = { planning = 4352 }

[[router.tiers]]
id            = "ocr-local"
base_url      = "http://host.docker.internal:30007/v1"
model         = "paddleocr-vl-1.6"
dialect       = "openai"
context_limit = 16384
privacy       = "local"
tool_support  = false
auth_env      = "ANVIL_OCR_LOCAL_KEY"
health_path   = "/health"

[[router.tiers]]
id            = "vision-local"
base_url      = "http://host.docker.internal:30008/v1"
model         = "qwen3-vl-4b-instruct"
dialect       = "openai"
context_limit = 16384
privacy       = "local"
tool_support  = false
auth_env      = "ANVIL_VISION_LOCAL_KEY"
health_path   = "/health"
model_identity = true

[[router.purpose_models]]
id       = "embeddings-local"
kind     = "embedding"
model    = "qwen3-embedding-0.6b"
base_url = "http://host.docker.internal:30005/v1"

[[router.purpose_models]]
id       = "reranker-local"
kind     = "rerank"
model    = "qwen3-reranker-0.6b"
base_url = "http://host.docker.internal:30006/v1"

[[router.audio_routes]]
id       = "dark-stt"
purpose  = "stt"
model    = "tdt-0.6b-v3"
base_url = "http://host.docker.internal:30010/v1"
timeout  = 25.0

[[router.audio_routes]]
id                 = "dark-tts"
purpose            = "tts"
model              = "kokoro"
base_url           = "http://host.docker.internal:30011/v1"
source_sample_rate = 24000
timeout            = 25.0

[router.model_routes]
# Additive direct capability aliases. A matched alias selects its named tier before
# legacy intent/profile/residency/fallback selection; unmatched models remain on the
# legacy path in slice 1. These are captured topology intent, not live qualification.
"llm.primary" = "heavy-local"
"llm.voice"   = "fast-local"

[router.presets]
chat         = ["heavy-local", "fast-local"]
chat-fast    = ["fast-local", "heavy-local"]
quick-edit   = ["heavy-local", "fast-local"]
review       = ["heavy-local"]
planning     = ["heavy-local"]
long-context = ["heavy-local"]
ocr          = ["ocr-local"]
vision       = ["vision-local"]
