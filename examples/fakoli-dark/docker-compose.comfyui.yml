# Generic managed ComfyUI worker template.
#
# Host identity, the real GPU UUID, model storage placement, and co-resident
# reservations belong in the private operator overlay. This public template is
# deliberately safe-by-default: loopback-only publication, an invalid placeholder
# GPU UUID until configured, no automatic restart, external persistent volumes,
# and a 28 GiB engine budget suitable for a privately declared 32 GiB worker.
#
# Manage this service through `anvil-serving serves`; direct compose commands are
# diagnostic only. The API/UI remains loopback-only unless the private operator
# explicitly changes COMFYUI_PUBLISH under its own exposure policy.
name: anvil-comfyui

services:
  comfyui:
    image: ${COMFYUI_IMAGE:-anvil-comfyui:0.33.4-cu130-addons-20260827}
    build:
      context: .
      dockerfile: Dockerfile.comfyui
    container_name: anvil-comfyui
    restart: "no"
    ports:
      - "${COMFYUI_PUBLISH:-127.0.0.1}:8188:8188"
    healthcheck:
      test: ["CMD", "/app/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5).read(1048576)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    volumes:
      - "anvil-comfyui-models:/app/models"
      - type: volume
        source: anvil-comfyui-user
        target: /app/output
        volume:
          subpath: output
      - type: volume
        source: anvil-comfyui-user
        target: /app/user
        volume:
          subpath: user
      - type: volume
        source: anvil-comfyui-user
        target: /app/input
        volume:
          subpath: input
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${MEDIA_WORKER_GPU_UUID:-GPU-REPLACE-WITH-MEDIA-WORKER-UUID}
      # This address is inside the container; the host publish above is the
      # exposure boundary and remains 127.0.0.1 by default.
      COMFYUI_ADDRESS: "0.0.0.0"
      COMFYUI_PORT: "8188"
      # 32 GiB reference envelope: reserve 4 GiB from ComfyUI and declare the
      # matching 28672 MiB reservation in serves.comfyui.toml.
      COMFYUI_EXTRA_ARGS: ${COMFYUI_EXTRA_ARGS:---reserve-vram 4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MEDIA_WORKER_GPU_UUID:-GPU-REPLACE-WITH-MEDIA-WORKER-UUID}"]
              capabilities: [gpu]

volumes:
  anvil-comfyui-models:
    external: true
  anvil-comfyui-user:
    external: true
