# fakoli-dark serves — the Docker-Compose source of truth for the LIVE (flexibility) tiers.
#
# `anvil-serving serves {status|up|down}` delegates here via serves.toml (docs/adr/0002):
# one `docker compose up -d <service>` per tier. Compose recreates a service natively when
# its config drifts, which fixes the stale-container drift bug the old ad-hoc `docker run`
# scripts had. DO NOT manage these serves with raw `docker`/`docker compose` — go through
# `anvil-serving serves` so the management experience stays consistent.
#
#   primary -> service `primary` (Agents-A1 official FP8, :30002, Compute A)
#   omni    -> service `omni` (Nemotron 3 Nano Omni, :30003, Compute B)
#   router -> service `router` (anvil-serving front door, :8000 — see docs/adr/0004)
#
# 2026-07-29 Primary promotion: Agents-A1 official FP8 replaces Qwen3.5 122B
# after the matched 262K head-to-head, thinking-disabled functional gate, and
# repeated protocol-v3 chat/context/tool/session/intelligence suite. Qwen is the
# immediate rollback; Laguna and GPT-OSS Puzzle remain additional recovery
# options.
# 2026-07-27 Omni consolidation: one Nemotron 3 Nano Omni serve replaces the
# former auxiliary LLM, OCR, and general-vision services. It consumes the 5090
# exclusively; embeddings and reranking remain a separate lifecycle stack.
# These replaced the agentic-mode tiers (sglang/qwen35-awq + gpt-oss-20b), which live
# in git history. The convention also shifted: weights now resolve as HF REPO-IDS from the
# `vllm-hfcache` docker volume (the `anvil-serving models pull` path) — NOT `/models/<dir>`
# bind paths from `fakoli-models`. A named volume is native ext4 inside WSL2 (~15s loads); a
# C:/ bind rides 9P and turns a cold load into 20-90 min (CLAUDE.md gotcha #15).
#
# `router` is the only service published beyond loopback (ADR-0004). `primary`/`omni` stay
# loopback-only and are reached by the router over host.docker.internal:<port> (the router's
# config volume; see the anvil-router-cfg volume, edited via `anvil-serving`).
#
# GPU UUIDs (env-overridable; default to THIS box so the file runs unchanged):
#   COMPUTE_A_GPU_UUID default GPU-d0f446cf-1771-414c-e116-a39138798a8c (PRO 6000 Max-Q)
#   COMPUTE_B_GPU_UUID default GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490 (PRO 6000 Max-Q)
# Find yours with `nvidia-smi --query-gpu=index,uuid --format=csv` (or `anvil-serving doctor`).
name: anvil-serving

services:
  # Primary tier: Agents-A1 official FP8 at its native 262,144-token window.
  # The exact vLLM nightly, checkpoint revision, FP8 KV profile, multimodal
  # limits, and single-sequence policy passed the recorded local qualification.
  # Thinking is hard-disabled at the router; default thinking is not qualified.
  primary:
    image: ${PRIMARY_AGENTS_A1_VLLM_IMAGE:-vllm/vllm-openai:nightly-f25953cc59f9b4ba9b04b16228d2b86dcfbcbdb1}
    container_name: vllm-agents-a1-fp8-primary
    restart: unless-stopped
    ipc: host
    shm_size: "32gb"
    ports:
      - "127.0.0.1:30002:30002"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}"]
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint: ["vllm"]
    command: >
      serve InternScience/Agents-A1-FP8
      --revision ${PRIMARY_AGENTS_A1_REVISION:-4d7d59380f327b76e73bc71f40e0c589ad0ca1d5}
      --served-model-name agents-a1-fp8-mm-262k
      --kv-cache-dtype fp8
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --limit-mm-per-prompt '{"image":4,"video":1}'
      --media-io-kwargs '{"video":{"num_frames":-1}}'
      --gpu-memory-utilization 0.94
      --max-num-seqs 1
      --max-model-len 262144
      --host 0.0.0.0 --port 30002
      ${PRIMARY_AGENTS_A1_EXTRA_ARGS:-}

  # Immediate Primary rollback: the previously qualified Qwen3.5 122B profile.
  # It shares :30002 and the PRO 6000, so the guarded promotion transaction
  # stops Agents-A1 before starting this service.
  primary-qwen35-rollback:
    profiles: ["rollback"]
    image: ${PRIMARY_QWEN35_VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.06-py3}
    container_name: vllm-qwen35-122b-primary-rollback
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:30002:30002"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}"]
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint: ["vllm"]
    command: >
      serve nvidia/Qwen3.5-122B-A10B-NVFP4
      --revision ${PRIMARY_QWEN35_REVISION:-98915d837c4e7c87ac8296d02e89de19b3207e6d}
      --tokenizer-revision ${PRIMARY_QWEN35_TOKENIZER_REVISION:-98915d837c4e7c87ac8296d02e89de19b3207e6d}
      --served-model-name qwen35-122b-a10b-nvfp4
      --trust-remote-code
      --quantization modelopt_fp4
      --kv-cache-dtype bfloat16
      --tensor-parallel-size 1
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --limit-mm-per-prompt '{"image":1,"video":0}'
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.94
      --max-num-seqs 1
      --max-model-len 262144
      --host 0.0.0.0 --port 30002
      ${PRIMARY_QWEN35_EXTRA_ARGS:-}

  # Additional Primary rollback: the previously qualified Laguna S 2.1 profile.
  primary-laguna-rollback:
    profiles: ["rollback"]
    image: ${PRIMARY_LAGUNA_VLLM_IMAGE:-vllm/vllm-openai:nightly-f25953cc59f9b4ba9b04b16228d2b86dcfbcbdb1}
    container_name: vllm-laguna-s-primary-rollback
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:30002:30002"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      MAX_JOBS: "4"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}"]
              capabilities: [gpu]
    ulimits:
      memlock: -1
      stack: 67108864
    entrypoint: ["vllm"]
    command: >
      serve poolside/Laguna-S-2.1-NVFP4
      --revision ${PRIMARY_LAGUNA_REVISION:-07614121b31898586430f189d27a25a0be310843}
      --tokenizer-revision ${PRIMARY_LAGUNA_TOKENIZER_REVISION:-07614121b31898586430f189d27a25a0be310843}
      --served-model-name laguna-s-2.1-nvfp4
      --language-model-only
      --tensor-parallel-size 1
      --enable-auto-tool-choice
      --tool-call-parser poolside_v1
      --reasoning-parser poolside_v1
      --default-chat-template-kwargs '{"enable_thinking":false}'
      --generation-config vllm
      --override-generation-config '{"temperature":0.7,"top_p":0.95,"top_k":20}'
      --enable-prefix-caching
      --enable-chunked-prefill
      --max-num-batched-tokens 8192
      --gpu-memory-utilization 0.90
      --max-num-seqs 1
      --max-model-len 262144
      --host 0.0.0.0 --port 30002
      ${PRIMARY_LAGUNA_EXTRA_ARGS:-}

  # Second-line recovery option: the previously qualified GPT-OSS Puzzle 88B.
  primary-gptoss-puzzle-rollback:
    profiles: ["rollback"]
    image: ${PRIMARY_PUZZLE_VLLM_IMAGE:-anvil-vllm:gpt-oss-puzzle-485463b3498ed3ffcf0c8fcb52c1670a21be5d82}
    container_name: vllm-gptoss-puzzle-primary-rollback
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:30002:30002"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_A_GPU_UUID:-GPU-d0f446cf-1771-414c-e116-a39138798a8c}"]
              capabilities: [gpu]
    entrypoint: ["vllm"]
    command: >
      serve nvidia/gpt-oss-puzzle-88B
      --revision ${PRIMARY_PUZZLE_REVISION:-9c0e0746a0d2218b28cc7b2cb3ce4e1a2f50fdb2}
      --served-model-name gpt-oss-puzzle-88b
      --trust-remote-code
      --tensor-parallel-size 1
      --moe-backend marlin
      --kv-cache-dtype fp8
      --tool-call-parser openai
      --enable-auto-tool-choice
      --enable-prefix-caching
      --override-generation-config '{"eos_token_id":[200002,199999,200012]}'
      --max-num-batched-tokens 8192
      --stream-interval 20
      --gpu-memory-utilization 0.95
      --max-num-seqs 8
      --max-cudagraph-capture-size 8
      --max-model-len 131072
      --host 0.0.0.0 --port 30002
      ${PRIMARY_PUZZLE_EXTRA_ARGS:-}

  # Exclusive Omni tier: auxiliary text, general vision, and OCR through one
  # OpenAI-compatible endpoint. Live qualification on 2026-07-27 pinned the
  # image/checkpoint below and measured 27674 MiB steady-state on the former 5090.
  # The 0.2860 engine target preserves the qualified 27999 MiB operating
  # budget; the reservation ledger prevents purpose-model co-residency.
  omni:
    image: ${OMNI_VLLM_IMAGE:-vllm/vllm-openai@sha256:907377dddef392f6b679d9c071e1c33c3935b4dc993b61d0352e391a5319ff3e}
    container_name: vllm-nemotron3-omni
    restart: unless-stopped
    ipc: host
    shm_size: "8gb"
    ports:
      - "127.0.0.1:30003:30003"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}"]
              capabilities: [gpu]
    entrypoint: ["vllm"]
    command: >
      serve nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
      --revision ${OMNI_REVISION:-dc5f0b0bfddf8b6e0f5891475be9af05b80126fe}
      --served-model-name nemotron3-omni-30b-a3b-nvfp4
      --trust-remote-code
      --reasoning-parser nemotron_v3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --compilation-config '{"cudagraph_mode":"PIECEWISE"}'
      --mamba-ssm-cache-dtype float16
      --max-model-len 65536
      --max-num-seqs 2
      --gpu-memory-utilization 0.2860
      --host 0.0.0.0 --port 30003
      ${OMNI_EXTRA_ARGS:-}

  # Smaller Omni candidate that can coexist with the dedicated STT/TTS stack.
  # vLLM serves Qwen2.5-Omni's Thinker (text/image/audio -> text); it does not
  # replace Kokoro TTS. Its 0.2511 engine cap plus measured runtime overhead fits
  # the 24576 MiB reservation.
  omni-small:
    profiles: ["omni-small"]
    build:
      context: .
      dockerfile: Dockerfile.omni-small
      args:
        BASE_IMAGE: ${OMNI_SMALL_BASE_IMAGE:-vllm/vllm-openai@sha256:907377dddef392f6b679d9c071e1c33c3935b4dc993b61d0352e391a5319ff3e}
    image: ${OMNI_SMALL_VLLM_IMAGE:-anvil-vllm:omni-small-audio-a65f93fb2}
    container_name: vllm-qwen25-omni-3b
    restart: unless-stopped
    ipc: host
    shm_size: "8gb"
    ports:
      - "127.0.0.1:30013:30013"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}"]
              capabilities: [gpu]
    entrypoint: ["vllm"]
    command: >
      serve Qwen/Qwen2.5-Omni-3B
      --revision ${OMNI_SMALL_REVISION:-f75b40e3da2003cdd6e1829b1f420ca70797c34e}
      --served-model-name qwen25-omni-3b
      --max-model-len 32768
      --max-num-seqs 2
      --gpu-memory-utilization 0.2511
      --host 0.0.0.0 --port 30013
      ${OMNI_SMALL_EXTRA_ARGS:-}

  # ── Purpose-model serves (gpu-reservations:T009, ADR-0017 §7) ──
  # Text-embedding + reranker stack on Compute B. Both
  # are 0.6B bf16 checkpoints on the SAME pinned vLLM
  # image as `primary` (a standard image, so the UUID pin applies — gotcha #13; the index-pin
  # exception is gemma4-unified-specific, gotcha #21).
  #
  # ADR-0017 reservations: serves.toml declares gpu_role "dark-compute-b" / residency "resident"
  # with vram_mib 3200 (embeddings) and 3456 (reranker). --gpu-memory-utilization below is
  # vram_mib / 97887 CAPACITY (fraction of TOTAL device memory):
  # 0.0327 = 3200/97887 and 0.0353 = 3456/97887. Keep vram_mib and the
  # fraction in lockstep.
  #
  # HONEST-MEASURED floor (2026-07-13, single-instance): each engine reports
  # "Model loading took 1.12 GiB" of weights plus a ~1.70-1.75 GiB fixed runtime floor
  # (WSL2 CUDA context + torch/cuBLAS/NCCL workspaces + profiled activation peak) BEFORE
  # any KV — a 3072 MiB budget left only 0.17-0.18 GiB of KV, below even a 2048-token
  # window (vLLM: "estimated maximum model length is 1568-1728"). The windows below are
  # sized to the measured remainder: embeddings 2048 tokens (0.22 GiB KV vs ~0.35 available
  # at 3200), reranker 4096 tokens (0.44 GiB KV vs ~0.55 available at 3456) — retrieval
  # chunks are short; rerank candidate docs run longer. --enforce-eager skips CUDA-graph
  # capture (pooling serves never decode, so graphs buy nothing and their memory would eat
  # the KV margin); --max-num-batched-tokens caps the chunked-prefill activation peak.
  #
  # Publish: loopback-only by default (ADR-0004 — unauthenticated endpoints stay off the
  # LAN). Opt in to tailnet exposure per serve by setting EMBEDDINGS_PUBLISH /
  # RERANKER_PUBLISH to this host's tailnet address (e.g. 100.87.34.66) before `serves up`.
  embeddings:
    image: ${EMBEDDINGS_VLLM_IMAGE:-vllm/vllm-openai@sha256:e4f88a835143cd22aee2397a26ec6bb80b3a4a6fe0c882bcbc63822904766089}
    container_name: vllm-qwen3-embedding
    restart: unless-stopped
    ipc: host
    ports:
      - "${EMBEDDINGS_PUBLISH:-127.0.0.1}:30005:30005"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      # Authenticate the startup HF-hub metadata check (weights are already cached). Empty if unset.
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}"]
              capabilities: [gpu]
    entrypoint: ["vllm"]
    # --runner pooling --convert embed: this vLLM (0.23) replaced the old `--task embed`
    # spelling. 2048-token window is a deliberate serving cap (retrieval chunks), not the
    # model's 32K max — it bounds the KV floor inside the 3200 MiB reservation (see the
    # measured-floor note above).
    command: >
      serve Qwen/Qwen3-Embedding-0.6B
      --revision ${EMBEDDINGS_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      --served-model-name qwen3-embedding-0.6b
      --runner pooling
      --convert embed
      --max-model-len 2048
      --max-num-batched-tokens 2048
      --max-num-seqs 16
      --enforce-eager
      --gpu-memory-utilization 0.0327
      --host 0.0.0.0 --port 30005

  reranker:
    image: ${RERANKER_VLLM_IMAGE:-vllm/vllm-openai@sha256:e4f88a835143cd22aee2397a26ec6bb80b3a4a6fe0c882bcbc63822904766089}
    container_name: vllm-qwen3-reranker
    restart: unless-stopped
    ipc: host
    ports:
      - "${RERANKER_PUBLISH:-127.0.0.1}:30006:30006"
    volumes:
      - "vllm-hfcache:/root/.cache/huggingface"
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: ${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_V2_MODEL_RUNNER: "0"
      FLASHINFER_CUDA_ARCH_LIST: "12.0f"
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMPUTE_B_GPU_UUID:-GPU-f0c3bae2-f800-2c37-5bef-a6166b44c490}"]
              capabilities: [gpu]
    entrypoint: ["vllm"]
    # The upstream vLLM recipe for the original Qwen3-Reranker checkpoints: override the
    # architecture to Qwen3ForSequenceClassification so the pooling runner serves it as a
    # cross-encoder scorer (/rerank, /score), with classifier_from_token +
    # is_original_qwen3_reranker mapping the "yes"/"no" LM-head tokens to the relevance score.
    command: >
      serve Qwen/Qwen3-Reranker-0.6B
      --revision ${RERANKER_REVISION:-e61197ed45024b0ed8a2d74b80b4d909f1255473}
      --served-model-name qwen3-reranker-0.6b
      --runner pooling
      --hf-overrides '{"architectures":["Qwen3ForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      --max-model-len 4096
      --max-num-batched-tokens 2048
      --max-num-seqs 8
      --enforce-eager
      --gpu-memory-utilization 0.0353
      --host 0.0.0.0 --port 30006

  # Router: single network-facing, token-authed endpoint (ADR-0004). Reaches heavy/fast over
  # host.docker.internal:<port>. Pinned to the locally built release image anvil-serving:0.18.0
  # and a config VOLUME (anvil-router-cfg). Build that image with the repository Dockerfile; do
  # not use `build:` here, so `up` runs the exact configured runtime tag.
  # Bump this tag with the package version on each router release.
  # ROUTER_IMAGE is a per-invocation CANDIDATE override for pre-release router verification
  # (e.g. `ROUTER_IMAGE=anvil-serving:0.18.0rc1 anvil-serving router up`); a bare `up` always
  # reproduces the pinned release.
  router:
    image: ${ROUTER_IMAGE:-anvil-serving:0.18.0}
    container_name: anvil-router
    restart: unless-stopped
    ports:
      - "${ROUTER_PUBLISH:-127.0.0.1}:8000:8000"
    environment:
      ANVIL_ROUTER_TOKEN: ${ANVIL_ROUTER_TOKEN:-}
    volumes:
      # The direct-alias config lives in the anvil-router-cfg volume (/etc/anvil), read-only
      # inside the container. Provision it before starting the router.
      # SEED IT on a fresh host before the first `up`: an EMPTY volume has no config.toml so the
      # router crash-loops; on an UPGRADE the persisted volume may still hold OLD tier ports, so
      # replace config.toml and restart the router after changing the topology.
      - "anvil-router-cfg:/etc/anvil:ro"

volumes:
  # Model weights (HF cache). External so `down -v` can never delete the pulled weights.
  vllm-hfcache:
    external: true
  # Router direct-alias config. External so it survives recreates and is edited independently.
  anvil-router-cfg:
    external: true
