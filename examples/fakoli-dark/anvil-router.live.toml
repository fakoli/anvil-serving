# Fakoli Dark reference topology. This is a configuration example, not live
# qualification evidence. Use preflight and benchmark artifacts before exposure.
[server]
auth_env = "ANVIL_ROUTER_TOKEN"

[router]
relay_timeout = 60
availability_probe_interval = 5
availability_probe_timeout = 1

# RTX PRO 6000: the sole primary LLM capability.
[[router.tiers]]
id = "heavy-local"
base_url = "http://host.docker.internal:30002/v1"
model = "laguna-s-2.1-nvfp4"
dialect = "openai"
context_limit = 262144
privacy = "local"
tool_support = true
auth_env = "ANVIL_HEAVY_LOCAL_KEY"
health_path = "/health"
model_identity = true

# RTX 5090: low-latency voice LLM and specialized vision capabilities.
[[router.tiers]]
id = "fast-local"
base_url = "http://host.docker.internal:30003/v1"
model = "gemma4-e4b-it"
dialect = "openai"
context_limit = 32768
privacy = "local"
tool_support = true
auth_env = "ANVIL_FAST_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "ocr-local"
base_url = "http://host.docker.internal:30007/v1"
model = "paddleocr-vl-1.6"
dialect = "openai"
context_limit = 16384
privacy = "local"
tool_support = false
auth_env = "ANVIL_OCR_LOCAL_KEY"
health_path = "/health"

[[router.tiers]]
id = "vision-local"
base_url = "http://host.docker.internal:30008/v1"
model = "qwen3-vl-4b-instruct"
dialect = "openai"
context_limit = 16384
privacy = "local"
tool_support = false
auth_env = "ANVIL_VISION_LOCAL_KEY"
health_path = "/health"
model_identity = true

[router.model_routes]
llm.primary = "heavy-local"
llm.voice = "fast-local"
vision.ocr = "ocr-local"
vision.general = "vision-local"

[[router.purpose_models]]
id = "embeddings-local"
kind = "embedding"
model = "qwen3-embedding-0.6b"
base_url = "http://host.docker.internal:30005/v1"

[[router.purpose_models]]
id = "reranker-local"
kind = "rerank"
model = "qwen3-reranker-0.6b"
base_url = "http://host.docker.internal:30006/v1"

[[router.audio_routes]]
id = "dark-stt"
purpose = "stt"
model = "tdt-0.6b-v3"
base_url = "http://host.docker.internal:30010/v1"
default = true

[[router.audio_routes]]
id = "dark-tts"
purpose = "tts"
model = "kokoro"
base_url = "http://host.docker.internal:30011/v1"
source_sample_rate = 24000
default = true
