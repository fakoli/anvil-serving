# q36 is an opt-in experiment on Compute A, not a production workload.
# It predates reservation sizing, so exclusive mode still treats it as GPU
# inference and stops or blocks it. Stop competing Compute A work first.

[[serve]]
name = "q36-pro6000"
container = "q36-pro6000"
port = 39040
model = "qwen3.6-35b-a3b"
engine = "q36"
health = "/health"
groups = ["q36-experiment"]
up = "docker compose -f {dir}/docker-compose.q36.yml up -d --build q36-pro6000"
