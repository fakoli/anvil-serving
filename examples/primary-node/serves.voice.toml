# Voice audio serves (STT/TTS) for the OpenClaw Talk reference topology.
# SEPARATE from serves.toml on purpose: these are always-on audio services
# owned by `anvil-serving voice audio up/down` (the host voice manifest points
# here via manifest_path). Generic `serves down` / serves_manage hygiene over
# serves.toml must never stop them - that is exactly the outage this split fixes.

# Published on Dark loopback (30010/30011) and the tailnet bridge ports
# (100.64.0.10:30110/30111) that Mini's realtime proxy targets.
[[serve]]
name = "stt"                   # parakeet.cpp tdt-0.6b-v3 (Compute B)
stack = "voice-audio"
container = "anvil-voice-stt"
runtime = "docker"
port = 30010
model = "tdt-0.6b-v3"
engine = "audio"
gpu_role = "dark-compute-b"
vram_mib = 2048
residency = "resident"
groups = ["voice", "omni-voice-stack"]
up = "docker compose --project-name anvil-voice-audio -f {dir}/docker-compose.voice-audio.yml up -d stt"

[[serve]]
name = "tts"                   # kokoro-fastapi (Compute B)
stack = "voice-audio"
container = "anvil-voice-tts"
runtime = "docker"
port = 30011
model = "kokoro"
engine = "audio"
health = "/health"
gpu_role = "dark-compute-b"
vram_mib = 2048
residency = "resident"
groups = ["voice", "omni-voice-stack"]
up = "docker compose --project-name anvil-voice-audio -f {dir}/docker-compose.voice-audio.yml up -d tts"

# Realtime voice proxy as a Docker-MANAGED CONTAINER (reuses the anvil-serving
# image running `anvil-serving voice proxy run`). Harness-independent: it is
# configured with DIRECT stt/tts/router endpoints in [voice.proxy], so it never
# resolves per-harness topology. Brought up with `anvil-serving voice proxy up`
# (managed lifecycle), after the audio serves (`anvil-serving voice audio up`).
[[serve]]
name = "realtime-proxy"
gpu_inference = false
stack = "voice-proxy"
container = "anvil-voice-proxy"
runtime = "docker"
port = 8765
model = "anvil-realtime-proxy"
engine = "audio"
health = "/healthz"            # the proxy's token-free readiness route
groups = ["voice"]             # serve groups (serves up/down/status --group)
up = "docker compose --project-name anvil-voice-proxy -f {dir}/docker-compose.voice-proxy.yml up -d realtime-proxy"

# Voice memo capture (ADR-0048): `anvil-serving voice memo run` in the
# `voice-memo` Dockerfile target. No GPU; transcribes through the gateway's
# /v1/audio/transcriptions with a route-bound device key. Brought up with
# `anvil-serving serves up voice-memo --manifest serves.voice.toml`.
[[serve]]
name = "voice-memo"
gpu_inference = false
stack = "voice-memo"
container = "anvil-voice-memo"
runtime = "docker"
port = 8790
model = "anvil-voice-memo"
engine = "audio"
health = "/healthz"
groups = ["voice"]
up = "docker compose --project-name anvil-voice-memo -f {dir}/docker-compose.voice-memo.yml up -d voice-memo"
