site_name: Anvil Serving
site_description: >-
  Operate, qualify, and expose local AI capabilities through explicit,
  reviewable contracts.
site_url: https://fakoli.github.io/anvil-serving/
repo_url: https://github.com/fakoli/anvil-serving
repo_name: fakoli/anvil-serving
edit_uri: edit/main/docs/

docs_dir: docs

# The preserved standalone prototype owns this directory's index.html.
exclude_docs: |
  /design/workbench/README.md

theme:
  name: material
  icon:
    logo: material/anvil
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mermaid2:
      # Use a stable mermaid 11.x release; the plugin injects this CDN JS
      # automatically - no extra_javascript block needed.
      version: '11.4.1'

# Builds benchmark records from retained findings evidence at site build time.
hooks:
  - scripts/mkdocs_benchmark_records.py
  - scripts/mkdocs_recipe_catalog.py
  - scripts/mkdocs_product_journeys.py

# Organize the site by the seven product journeys in product_families.py order.
# Each journey opens on its overview page; dense catalogs stay reachable through
# their index pages. Dated findings live in the findings index, not the nav.
