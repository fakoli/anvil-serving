site_name: anvil-serving
site_description: >-
  Benchmark and serve local models through a thin capability gateway.
site_url: https://fakoli.github.io/anvil-serving/
repo_url: https://github.com/fakoli/anvil-serving
repo_name: fakoli/anvil-serving
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mermaid2:
      # Use a stable mermaid 11.x release; the plugin injects this CDN JS
      # automatically - no extra_javascript block needed.
      version: '11.4.1'

nav:
  - Home: index.md
  - Get started: GETTING-STARTED.md
  - Serve models:
      - Catalog, artifacts & recipes: MODEL-LIFECYCLE.md
      - Promote and roll back: MODEL-PROMOTION.md
      - Serve lifecycle commands: cli/serves.md
      - Models & recipes commands: cli/models.md
      - Model settings example: MODEL-SETTINGS-EXAMPLE.md
  - Route through the gateway:
      - Architecture: ARCHITECTURE.md
      - Thin capability gateway: THIN-CAPABILITY-GATEWAY.md
      - Configuration reference: CONFIGURATION.md
      - Embeddings & reranking: PURPOSE-MODELS.md
      - Router commands: cli/router.md
      - Terminology: TERMINOLOGY.md
  - Voice & audio:
      - Voice pipeline: VOICE.md
      - Voice commands: cli/voice.md
  - Operate the host:
      - Operator playbooks: OPERATOR-PLAYBOOKS.md
      - Public product and private operator state: OPERATOR-PRIVACY.md
      - Repository history reset runbook: HISTORY-RESET-RUNBOOK.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Host & setup commands: cli/host.md
      - Control plane & integrations commands: cli/control-plane.md
      - Device topologies: DEVICE-TOPOLOGIES.md
      - Tailnet endpoint runbook: TAILNET-ENDPOINT-RUNBOOK.md
      - ComfyUI migration runbook: COMFYUI-MIGRATION-RUNBOOK.md
  - Integrate a harness:
      - Agent workbench: WORKBENCH.md
      - OpenClaw integration spec: OPENCLAW-INTEGRATION-SPEC.md
      - Operator skills and sub-agents: OPERATOR-SKILLS-AND-SUBAGENTS.md
  - Command index: CLI.md
  - Benchmarks:
