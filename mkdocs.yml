      - 'ADR-0030: Containerized Dark controller and MCP 2026': adr/0030-containerized-remote-controller-and-mcp-2026.md
      - 'ADR-0031: Dual-era TypeScript MCP bridge': adr/0031-dual-era-typescript-mcp-bridge.md
      - 'ADR-0032: Public product, private operator state': adr/0032-public-product-private-operator-state.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # fence_mermaid (NOT fence_mermaid_custom) emits <div class="mermaid">
          # without a <code> wrapper and without escaping < / > - so <br/> in node
          # labels stays as literal text that mermaid.js can parse.
          # fence_mermaid_custom sets custom=True -> <pre class="mermaid"><code>
          # which wraps the source in <code>, breaking the mermaid parser.
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
