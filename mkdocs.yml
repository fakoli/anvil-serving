site_name: Anvil Serving
site_description: >-
  Operate, qualify, and expose local AI capabilities through explicit,
  reviewable contracts.
site_url: https://fakoli.github.io/anvil-serving/
repo_url: https://github.com/fakoli/anvil-serving
repo_name: fakoli/anvil-serving
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  icon:
    logo: material/anvil
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mermaid2:
      # Use a stable mermaid 11.x release; the plugin injects this CDN JS
      # automatically - no extra_javascript block needed.
      version: '11.4.1'

# Keep the top level task-oriented and shallow. Dense catalogs remain reachable
# through their index pages instead of expanding into the global navigator.
nav:
  - Get started:
      - Overview: index.md
      - Install and run a first serve: GETTING-STARTED.md
      - Private networking with Tailscale: TAILSCALE-NETWORKING.md
      - Product map and journeys: PRODUCT-FAMILIES.md
      - Discover the product from the CLI: cli/product.md
  - Benchmarks & evidence:
      - Overview: benchmarks/index.md
      - Find a measured recipe: benchmarks/recipe-results.md
      - Compare models: benchmarks/comparison.md
      - Reproduce configurations: benchmarks/configurations.md
      - Model dossiers: benchmarks/models/index.md
      - Hardware:
          - RTX PRO 6000: benchmarks/hardware/rtx-pro-6000.md
          - RTX 5090: benchmarks/hardware/rtx-5090.md
      - Run catalog: benchmarks/runs.md
      - Context, agentic, and SWE jobs: benchmarks/context-agentic-swe.md
      - Methodology and evidence rules: benchmarks/methodology.md
      - Finding publication format: benchmarks/finding-format.md
      - External benchmarks: EXTERNAL-BENCHMARKS.md
      - Findings index: findings/README.md
      - Archive:
          - Chronological results: BENCHMARKS.md
          - RTX PRO 6000 recipe index: benchmarks/models.md
          - RTX PRO 6000 mention audit: benchmarks/rtx-pro-6000-audit.md
  - Operate:
      - Model Serving:
          - Catalog, artifacts, and recipes: MODEL-LIFECYCLE.md
          - Promote and roll back: MODEL-PROMOTION.md
      - Voice and Media:
          - Voice pipeline: VOICE.md
          - Media workflows: cli/media.md
      - Fleet and host operations:
          - Operator playbooks: OPERATOR-PLAYBOOKS.md
          - Read workload activity: WORKLOAD-VISIBILITY.md
          - Fleet state and replication: FLEET-STATE.md
          - Device topologies: DEVICE-TOPOLOGIES.md
          - Tailnet endpoint runbook: TAILNET-ENDPOINT-RUNBOOK.md
  - Integrate:
      - Capability Gateway:
          - Gateway overview: META-ROUTER.md
          - Request path: THIN-CAPABILITY-GATEWAY.md
          - Diagnose a request: ROUTER-DIAGNOSTICS.md
          - Remote tailnet endpoints: REMOTE-TAILNET-ENDPOINTS.md
          - Router delivery roadmap: ROUTER-ROADMAP.md
          - Embeddings and reranking: PURPOSE-MODELS.md
      - OpenClaw integration: OPENCLAW-INTEGRATION-SPEC.md
      - Agent workbench: WORKBENCH.md
      - Operator skills and sub-agents: OPERATOR-SKILLS-AND-SUBAGENTS.md
  - Reference:
      - Product contracts:
          - Architecture: ARCHITECTURE.md
          - Configuration: CONFIGURATION.md
          - Terminology: TERMINOLOGY.md
          - Public product and private operator state: OPERATOR-PRIVACY.md
      - Command-line reference:
          - Command index: CLI.md
          - Serve lifecycle: cli/serves.md
          - Models and recipes: cli/models.md
          - Capability Gateway: cli/router.md
          - Evaluation and benchmarks: cli/eval.md
          - Voice: cli/voice.md
          - Host and setup: cli/host.md
          - Fleet: cli/fleet.md
          - Control Plane and Fleet: cli/control-plane.md
      - Help and project records:
          - Troubleshooting: TROUBLESHOOTING.md
          - Architecture decisions: adr/README.md
          - Proposed improvements (PRDs): prds/README.md
          - Feature execution playbook: FEATURE-EXECUTION-PLAYBOOK.md
          - Product discovery personas: PRODUCT-DISCOVERY-PERSONAS.md
          - Strategy - make divergence loud: STRATEGY-MAKE-DIVERGENCE-LOUD.md
          - Model settings example: MODEL-SETTINGS-EXAMPLE.md
          - ComfyUI migration runbook: COMFYUI-MIGRATION-RUNBOOK.md
          - Repository history reset: HISTORY-RESET-RUNBOOK.md
          - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # fence_mermaid (NOT fence_mermaid_custom) emits <div class="mermaid">
          # without a <code> wrapper and without escaping < / > - so <br/> in node
          # labels stays as literal text that mermaid.js can parse.
          # fence_mermaid_custom sets custom=True -> <pre class="mermaid"><code>
          # which wraps the source in <code>, breaking the mermaid parser.
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.snippets:
      base_path: ['.']
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.inlinehilite
