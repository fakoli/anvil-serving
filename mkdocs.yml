      - 'ADR-0012: Serve and router management verbs': adr/0012-serve-and-router-management-verbs.md
      - 'ADR-0013: OpenClaw layers and MCP control plane': adr/0013-openclaw-layers-and-mcp-control-plane.md
      - 'ADR-0014: Tailnet controller transport': adr/0014-tailnet-controller-transport.md
      - 'ADR-0015: Operator skills and sub-agent workflows': adr/0015-operator-skills-and-subagent-workflows.md
      - 'ADR-0016: Runtime tier readiness': adr/0016-runtime-tier-readiness.md
      - 'ADR-0017: GPU residency reservations': adr/0017-gpu-residency-reservations.md
      - 'ADR-0018: Router transition safety': adr/0018-router-transition-safety.md
      - 'ADR-0019: anvil-serving owns the tailnet edge': adr/0019-anvil-serving-owns-the-tailnet-edge.md
      - 'ADR-0020: init defaults to the home scaffold': adr/0020-init-defaults-to-home-scaffold-shipped-as-package-data.md
